<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,viewport-fit=cover"
        />
        <title>3D Vector Visualizer</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                height: 100vh;
                height: 100dvh;
                display: flex;
                flex-direction: column;
                font:
                    14px/1.5 system-ui,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--tx);
                --bg: #0f1420;
                --pn: #151c2b;
                --ln: #26314a;
                --tx: #e8edf7;
                --mu: #93a0bd;
                --ac: #6cb4ff;
                --glass: rgba(21, 28, 43, 0.86);
            }
            body.lt {
                color-scheme: light;
                --bg: #fff;
                --pn: #f4f6fb;
                --ln: #d8deeb;
                --tx: #182033;
                --mu: #5d6985;
                --ac: #1f7ae0;
                --glass: rgba(244, 246, 251, 0.9);
            }
            [hidden] {
                display: none !important;
            }
            header {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
                padding: 8px 12px;
                background: var(--pn);
                border-bottom: 1px solid var(--ln);
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 700;
                font-size: 15px;
                margin-right: 6px;
                white-space: nowrap;
            }
            .sp {
                flex: 1;
            }
            .hm {
                display: flex;
                gap: 8px;
            }
            button,
            select,
            input {
                font: inherit;
                color: var(--tx);
                background: var(--bg);
                border: 1px solid var(--ln);
                border-radius: 8px;
                padding: 5px 10px;
                transition:
                    border-color 0.15s,
                    background 0.15s;
            }
            button,
            select {
                cursor: pointer;
            }
            button:hover,
            select:hover {
                border-color: var(--ac);
            }
            :focus-visible {
                outline: 2px solid var(--ac);
                outline-offset: 1px;
            }
            #pre {
                border-color: var(--ac);
            }
            input[type="color"] {
                width: 32px;
                height: 28px;
                padding: 2px;
                flex: none;
            }
            input[type="range"] {
                padding: 0;
                flex: 1;
            }
            input[type="checkbox"] {
                padding: 0;
                width: auto;
                accent-color: var(--ac);
            }
            input[type="number"] {
                appearance: textfield;
                -moz-appearance: textfield;
                text-align: center;
                padding: 5px 2px;
                font-variant-numeric: tabular-nums;
            }
            input[type="number"]::-webkit-inner-spin-button,
            input[type="number"]::-webkit-outer-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            main {
                flex: 1;
                min-height: 0;
                display: grid;
                grid-template-columns: 310px 1fr 350px;
                grid-template-rows: minmax(0, 1fr);
            }
            aside {
                overflow: auto;
                padding: 4px 14px 18px;
                background: var(--pn);
            }
            #LP {
                border-right: 1px solid var(--ln);
            }
            #RP {
                border-left: 1px solid var(--ln);
            }
            h3 {
                margin: 18px 0 8px;
                font-size: 13px;
                font-weight: 600;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            h3 button {
                padding: 2px 10px;
                font-size: 12px;
                font-weight: 400;
            }
            h3 label {
                font-weight: 400;
                color: var(--mu);
                font-size: 12px;
            }
            .card {
                border: 1px solid var(--ln);
                border-radius: 10px;
                padding: 8px;
                margin-bottom: 8px;
                background: var(--bg);
                cursor: pointer;
            }
            .card.sel {
                border-color: var(--ac);
                box-shadow: 0 0 0 1px var(--ac);
            }
            .card:not(.sel) .sub,
            .card.sel .sum {
                display: none;
            }
            .sum {
                color: var(--mu);
                font-size: 12px;
                margin: 2px 0 0 2px;
                font-variant-numeric: tabular-nums;
            }
            .row {
                display: flex;
                gap: 4px;
                align-items: center;
                margin: 4px 0;
            }
            .row label {
                white-space: nowrap;
                font-size: 12px;
                color: var(--mu);
            }
            .row span {
                width: 34px;
                color: var(--mu);
                font-size: 12px;
                flex: none;
            }
            .row input[type="number"],
            .row input:not([type]),
            .row select {
                width: 0;
                flex: 1;
                min-width: 0;
            }
            .ax {
                flex: 1;
                text-align: center;
                font-size: 12px;
            }
            .empty {
                color: var(--mu);
                font-size: 12.5px;
                padding: 6px 2px;
            }
            .ck {
                display: block;
                margin: 4px 0;
            }
            #cv {
                position: relative;
                min-width: 0;
                overflow: hidden;
            }
            canvas {
                position: absolute;
                width: 100%;
                height: 100%;
                touch-action: none;
                cursor: grab;
            }
            canvas:active {
                cursor: grabbing;
            }
            .ov {
                position: absolute;
                background: var(--glass);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                border: 1px solid var(--ln);
                border-radius: 12px;
            }
            #views {
                top: 10px;
                left: 10px;
                display: flex;
                gap: 2px;
                padding: 3px;
                max-width: calc(100% - 20px);
                overflow-x: auto;
            }
            #views button {
                border: 0;
                background: none;
                padding: 4px 9px;
                border-radius: 8px;
                font-size: 12.5px;
            }
            #views button:hover {
                background: var(--ln);
            }
            #hint {
                top: 54px;
                left: 10px;
                padding: 5px 10px;
                font-size: 12px;
                color: var(--mu);
                pointer-events: none;
                transition: opacity 0.5s;
            }
            #bar {
                left: 10px;
                right: 10px;
                bottom: 10px;
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
                justify-content: center;
                padding: 7px 9px;
            }
            #tv {
                display: contents;
            }
            #ks {
                width: 110px;
            }
            #selname {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 12.5px;
                color: var(--mu);
                padding-right: 4px;
            }
            #selname i {
                width: 10px;
                height: 10px;
                border-radius: 50%;
            }
            .chip {
                position: relative;
            }
            .chip input[type="checkbox"] {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                opacity: 0;
                cursor: pointer;
            }
            .chip span {
                display: block;
                width: auto;
                padding: 5px 12px;
                border: 1px solid var(--ln);
                border-radius: 99px;
                font-size: 12.5px;
                background: var(--bg);
                user-select: none;
                color: var(--tx);
            }
            .chip:hover span {
                border-color: var(--ac);
            }
            .chip input:checked + span {
                background: var(--ac);
                border-color: var(--ac);
                color: #06121f;
                font-weight: 600;
            }
            .chip input:focus-visible + span {
                outline: 2px solid var(--ac);
                outline-offset: 2px;
            }
            #ex {
                border-left: 3px solid var(--ac);
                background: var(--bg);
                border-radius: 0 10px 10px 0;
                padding: 9px 12px;
                margin-top: 12px;
                line-height: 1.55;
            }
            #ex:empty {
                display: none;
            }
            #calc div {
                padding: 4px 0;
                border-bottom: 1px solid var(--ln);
                font-size: 13px;
                font-variant-numeric: tabular-nums;
            }
            #calc hr {
                border: 0;
                margin: 8px 0;
            }
            #calc b {
                color: var(--ac);
            }
            details {
                margin-top: 16px;
                border-top: 1px solid var(--ln);
                padding-top: 8px;
            }
            summary {
                cursor: pointer;
                font-weight: 600;
                padding: 4px 0;
            }
            #tabs {
                display: none;
            }
            #xp {
                display: none;
                position: fixed;
                top: 10px;
                right: 10px;
            }
            body.pres header,
            body.pres aside,
            body.pres #hint {
                display: none;
            }
            body.pres main {
                grid-template-columns: 1fr;
            }
            body.pres #xp {
                display: block;
            }
            @media (max-width: 900px) {
                main {
                    display: block;
                    position: relative;
                }
                #cv {
                    position: absolute;
                    inset: 0;
                }
                aside {
                    position: absolute;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    max-height: 58%;
                    display: none;
                    z-index: 5;
                    border: 0;
                    border-top: 1px solid var(--ln);
                    border-radius: 16px 16px 0 0;
                    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.35);
                }
                body[data-t="LP"] #LP,
                body[data-t="RP"] #RP {
                    display: block;
                }
                #tabs {
                    display: flex;
                    background: var(--pn);
                    border-top: 1px solid var(--ln);
                }
                #tabs button {
                    flex: 1;
                    border: 0;
                    border-radius: 0;
                    background: none;
                    padding: 12px;
                }
                body[data-t="view"] #tabs [data-t="view"],
                body[data-t="LP"] #tabs [data-t="LP"],
                body[data-t="RP"] #tabs [data-t="RP"] {
                    color: var(--ac);
                    font-weight: 600;
                }
                .hm,
                #pp,
                #hint {
                    display: none;
                }
            }
            .sc {
                display: inline-flex;
            }
            .sc .chip span {
                border-radius: 99px 0 0 99px;
                padding-right: 9px;
            }
            .sc .gear {
                border-radius: 0 99px 99px 0;
                padding: 5px 10px 5px 7px;
                border-left: 0;
                color: var(--mu);
                font-size: 14px;
                line-height: 1.2;
            }
            .sc .gear:hover {
                color: var(--ac);
            }
            .sc:has(input:checked) .gear {
                background: var(--ac);
                border-color: var(--ac);
                color: #06121f;
            }
            .sc:not(:has(.gear)) .chip span {
                border-radius: 99px;
                padding-right: 12px;
            }
            #pop,
            #adv {
                padding: 6px 14px 10px;
                z-index: 4;
            }
            #pop {
                left: 50%;
                transform: translateX(-50%);
                bottom: 96px;
                width: min(320px, calc(100% - 20px));
            }
            #adv {
                top: 10px;
                right: 10px;
                width: 310px;
                max-height: calc(100% - 90px);
                overflow: auto;
            }
            #pop h3,
            #adv h3 {
                margin: 12px 0 4px;
            }
            output {
                width: 40px;
                text-align: right;
                font-size: 12px;
                color: var(--mu);
                flex: none;
            }
            input.bad {
                border-color: #ff5d5d;
            }
            * {
                -webkit-tap-highlight-color: transparent;
            }
            canvas {
                user-select: none;
            }
            aside {
                overscroll-behavior: contain;
            }
            #adv:has(input[type="range"]:active),
            #pop:has(input[type="range"]:active) {
                opacity: 0.2;
            }
            @media (max-width: 1200px) {
                main {
                    grid-template-columns: 260px 1fr 290px;
                }
            }
            @media (max-width: 900px) {
                header {
                    gap: 6px;
                    padding: 6px 8px;
                    padding-top: max(6px, env(safe-area-inset-top));
                }
                #pre {
                    flex: 1;
                    min-width: 0;
                }
                input,
                select {
                    font-size: 16px;
                }
                #bar {
                    flex-wrap: nowrap;
                    overflow-x: auto;
                    justify-content: flex-start;
                    scrollbar-width: none;
                    padding: 6px 8px;
                }
                #bar::-webkit-scrollbar {
                    display: none;
                }
                #bar > *,
                #tv > * {
                    flex: none;
                }
                #pop {
                    left: 10px;
                    right: 10px;
                    width: auto;
                    transform: none;
                    bottom: 68px;
                    max-height: 46%;
                    overflow: auto;
                }
                #adv {
                    left: 10px;
                    right: 10px;
                    top: auto;
                    bottom: 68px;
                    width: auto;
                    max-height: 46%;
                }
                #tabs {
                    padding-bottom: env(safe-area-inset-bottom);
                }
            }
            @media (max-width: 640px) {
                .bt {
                    display: none;
                }
            }
            @media (pointer: coarse) {
                button,
                select,
                input:not([type="checkbox"]):not([type="range"]):not(
                        [type="color"]
                    ) {
                    min-height: 40px;
                }
                .chip span {
                    padding: 10px 14px;
                }
                .sc .gear {
                    padding: 10px 12px 10px 8px;
                }
                #views button {
                    padding: 9px 12px;
                }
                .row input[type="checkbox"] {
                    width: 20px;
                    height: 20px;
                }
            }
            @media (max-height: 480px) {
                header {
                    padding: 4px 8px;
                }
                aside {
                    max-height: 72%;
                }
            }
            .cb,
            .rh {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 30px;
                height: 30px;
                padding: 0;
                flex: none;
                color: var(--mu);
            }
            .cb:hover,
            .rh:hover {
                color: var(--ac);
            }
            .cb::before,
            .rh::before {
                content: "";
                width: 7px;
                height: 7px;
                border: solid currentColor;
                border-width: 0 2px 2px 0;
                transform: rotate(var(--r));
            }
            [data-c="l"].cb,
            [data-c="v"].cb {
                --r: 135deg;
            }
            [data-c="r"].cb,
            body.xv [data-c="v"].cb {
                --r: -45deg;
            }
            [data-c="t"].cb {
                --r: -135deg;
            }
            [data-c="b"].cb {
                --r: 45deg;
            }
            .colhead {
                display: flex;
                justify-content: space-between;
                align-items: center;
                position: sticky;
                top: 0;
                z-index: 2;
                background: var(--pn);
                padding: 8px 0 2px;
                font-weight: 600;
            }
            #views .cb {
                height: 28px;
            }
            body.xv #views button:not(.cb) {
                display: none;
            }
            .rh {
                display: none;
                z-index: 3;
                opacity: 0.85;
            }
            .rh:hover {
                opacity: 1;
            }
            #rl {
                --r: -45deg;
                left: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 22px;
                height: 56px;
                border-radius: 0 12px 12px 0;
                border-left: 0;
            }
            #rr {
                --r: 135deg;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 22px;
                height: 56px;
                border-radius: 12px 0 0 12px;
                border-right: 0;
            }
            #rt {
                --r: 45deg;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 56px;
                height: 22px;
                border-radius: 0 0 12px 12px;
                border-top: 0;
            }
            #rb {
                --r: -135deg;
                bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 56px;
                height: 22px;
                border-radius: 12px 12px 0 0;
                border-bottom: 0;
                margin-bottom: env(safe-area-inset-bottom);
            }
            body.xt header {
                display: none;
            }
            body.xt #rt,
            body.xb #rb {
                display: inline-flex;
            }
            body.xt #views {
                top: 30px;
            }
            body.xt #hint {
                top: 74px;
            }
            body.xb #bar,
            body.xb #tabs {
                display: none;
            }
            @media (min-width: 901px) {
                body {
                    --lw: 310px;
                    --rw: 350px;
                }
                main {
                    grid-template-columns: var(--lw) 1fr var(--rw);
                    transition: grid-template-columns 0.25s ease;
                }
                body.xl {
                    --lw: 0px;
                }
                body.xr {
                    --rw: 0px;
                }
                body.xl #LP,
                body.xr #RP {
                    visibility: hidden;
                    padding: 0;
                    border-width: 0;
                }
                body.xl #rl,
                body.xr #rr {
                    display: inline-flex;
                }
            }
            @media (min-width: 901px) and (max-width: 1200px) {
                body {
                    --lw: 260px;
                    --rw: 290px;
                }
            }
            @media (max-width: 900px) {
                [data-c="l"].cb,
                [data-c="r"].cb {
                    --r: 45deg;
                }
                #tabs .cb {
                    flex: none;
                    width: 52px;
                    height: auto;
                }
            }
            @media (pointer: coarse) {
                .cb {
                    width: 40px;
                }
            }
        </style>
    </head>
    <body data-t="view">
        <header>
            <div class="brand">
                <svg
                    width="22"
                    height="22"
                    viewBox="0 0 22 22"
                    fill="none"
                    stroke-width="2.4"
                    stroke-linecap="round"
                >
                    <path d="M11 12V3" stroke="#5aa9ff" />
                    <path d="M11 12l8 5" stroke="#ff5d5d" />
                    <path d="M11 12l-8 5" stroke="#3ddc84" /></svg
                ><span class="bt">3D Vector Visualizer</span>
            </div>
            <select id="pre" title="Load an example"></select
            ><span class="sp"></span>
            <button id="pp" title="Switch between perspective and orthographic">
                Perspective</button
            ><button id="th">Light / dark</button
            ><button id="adb" title="Text size, thickness, arrowheads and more">
                Advanced
            </button>
            <span class="hm"
                ><button id="sv">Save</button><button id="ld">Load</button
                ><button id="sh">PNG</button
                ><button id="pm">Present</button></span
            >
            <button
                class="cb"
                data-c="t"
                title="Hide top bar"
                aria-label="Hide top bar"
            ></button
            ><input type="file" id="fi" accept=".json" hidden />
        </header>
        <main>
            <aside id="LP">
                <div class="colhead">
                    <b>Objects</b
                    ><button
                        class="cb"
                        data-c="l"
                        title="Hide objects panel"
                        aria-label="Hide objects panel"
                    ></button>
                </div>
                <h3>Vectors <button id="av">Add</button></h3>
                <div id="vl"></div>
                <h3>Points <button id="ap">Add</button></h3>
                <div id="pl"></div>
                <h3>
                    Plane ax + by + cz = d
                    <label
                        ><input
                            type="checkbox"
                            data-a="pl"
                            data-i="0"
                            data-k="on"
                        />
                        show</label
                    >
                </h3>
                <div class="row">
                    <input
                        type="number"
                        step="any"
                        placeholder="a"
                        data-a="pl"
                        data-i="0"
                        data-k="p"
                        data-j="0"
                    /><input
                        type="number"
                        step="any"
                        placeholder="b"
                        data-a="pl"
                        data-i="0"
                        data-k="p"
                        data-j="1"
                    /><input
                        type="number"
                        step="any"
                        placeholder="c"
                        data-a="pl"
                        data-i="0"
                        data-k="p"
                        data-j="2"
                    /><input
                        type="number"
                        step="any"
                        placeholder="d"
                        data-a="pl"
                        data-i="0"
                        data-k="p"
                        data-j="3"
                    />
                </div>
            </aside>
            <section id="cv">
                <canvas id="c"></canvas>
                <div id="views" class="ov"></div>
                <button
                    class="ov rh"
                    id="rl"
                    data-c="l"
                    title="Show objects panel"
                    aria-label="Show objects panel"
                ></button
                ><button
                    class="ov rh"
                    id="rr"
                    data-c="r"
                    title="Show results panel"
                    aria-label="Show results panel"
                ></button
                ><button
                    class="ov rh"
                    id="rt"
                    data-c="t"
                    title="Show top bar"
                    aria-label="Show top bar"
                ></button
                ><button
                    class="ov rh"
                    id="rb"
                    data-c="b"
                    title="Show bottom bar"
                    aria-label="Show bottom bar"
                ></button>
                <div id="pop" class="ov" hidden></div>
                <div id="adv" class="ov" hidden>
                    <div class="row" style="justify-content: space-between">
                        <b>Advanced</b>
                        <div>
                            <button data-reset>Reset all</button>
                            <button id="advx" title="Close">✕</button>
                        </div>
                    </div>
                    <div id="advb"></div>
                </div>
                <div id="hint" class="ov">
                    Drag to rotate · Shift-drag to pan · Scroll to zoom · F for
                    full view
                </div>
                <div id="bar" class="ov">
                    <button
                        class="cb"
                        data-c="b"
                        title="Hide bottom bar"
                        aria-label="Hide bottom bar"
                    ></button
                    ><span id="selname"></span><span id="tv"></span
                    ><input
                        type="range"
                        id="ks"
                        data-z="k"
                        min="-3"
                        max="3"
                        step="0.1"
                        hidden
                    />
                </div>
            </section>
            <aside id="RP">
                <div class="colhead">
                    <b>Results</b
                    ><button
                        class="cb"
                        data-c="r"
                        title="Hide results panel"
                        aria-label="Hide results panel"
                    ></button>
                </div>
                <div id="ex"></div>
                <h3>Combine the selected vector with…</h3>
                <select id="zo" data-z="op" style="width: 100%"></select>
                <div class="row" id="opr">
                    <span>with</span
                    ><select id="zb" data-z="b"></select
                    ><span id="cl">and</span
                    ><select id="zc" data-z="c"></select>
                </div>
                <h3>Results</h3>
                <div id="calc"></div>
                <details>
                    <summary>Scene settings</summary>
                    <div id="to"></div>
                    <div class="row">
                        <span>Axis</span
                        ><input
                            type="range"
                            min="3"
                            max="20"
                            step="1"
                            data-z="L"
                        />
