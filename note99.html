      { id: "light-wideruled", theme: "light", label: "White Wide",  bg: "repeating-linear-gradient(0deg,#bfdbfe,#bfdbfe 1px,#ffffff 1px,#ffffff 13px)" },
      { id: "light-cornell",   theme: "light", label: "Cornell",     bg: "linear-gradient(90deg,#ffffff 28%,#fca5a5 28%,#fca5a5 30%,#ffffff 30%)" },
      { id: "light-isometric", theme: "light", label: "Isometric",   bg: "radial-gradient(#64748b 1.2px, #ffffff 1.2px) 0 0 / 10px 10px" },
      { id: "light-graph",     theme: "light", label: "Graph Paper", bg: "repeating-linear-gradient(0deg,#cbd5e1,#cbd5e1 1px,#ffffff 1px,#ffffff 7px),repeating-linear-gradient(90deg,#cbd5e1,#cbd5e1 1px,transparent 1px,transparent 7px)" },
      { id: "light-coord",     theme: "light", label: "XY Axes",     bg: "linear-gradient(0deg,transparent 47%,#64748b 47%,#64748b 53%,transparent 53%),linear-gradient(90deg,#ffffff 47%,#64748b 47%,#64748b 53%,#ffffff 53%)" },
      { id: "light-music",     theme: "light", label: "Music Staff", bg: "repeating-linear-gradient(0deg,#cbd5e1,#cbd5e1 1px,#ffffff 1px,#ffffff 4px)" }
    ];

    // =========================================================================
    // 6. MAIN REACT APPLICATION
    // =========================================================================
    const { useState, useEffect, useRef, useCallback } = window.React;

    function App() {
      const engineRef = useRef(new PageEngine4K());
      const [excalidrawAPI, setExcalidrawAPI] = useState(null);

      // Page state
      const [currentPage, setCurrentPage] = useState(0);
      const [totalPages, setTotalPages] = useState(1);
      const [isBusy, setIsBusy] = useState(false);
      const [statusMessage, setStatusMessage] = useState("");

      // UI & Fullscreen State
      const [isFullscreen, setIsFullscreen] = useState(false);
      const [uiTheme, setUiTheme] = useState("dark");
      const [toolLock, setToolLock] = useState(true);
      const [isFitMode, setIsFitMode] = useState(true);
      const isFitModeRef = useRef(true);

      useEffect(() => {
        isFitModeRef.current = isFitMode;
      }, [isFitMode]);

      // Default Page Background State (Starts dark in dark mode)
      const [defaultBgStyle, setDefaultBgStyle] = useState("dark-plain");
      const [hasCustomBgImage, setHasCustomBgImage] = useState(false);

      // 4K Rasterization Mode: "lazy" (On-Demand per page) or "all" (Pre-Rasterize Whole PDF on import)
      const [rasterizeMode, setRasterizeMode] = useState("lazy");

      // Bottom-Right 1-Column Preview Drawer State
      const [showPreviewDrawer, setShowPreviewDrawer] = useState(false);
      const [thumbnails, setThumbnails] = useState({});

      // Active Tool & Popover State
      const [activeTool, setActiveTool] = useState("pen");
      const [lastExtraTool, setLastExtraTool] = useState(null);
      const [openPopover, setOpenPopover] = useState(null); // null | "tool" | "color" | "menu" | "background"
      const [editingWidthSlot, setEditingWidthSlot] = useState(false);

      // Tracks whether Shapes have been independently customized away from Pen defaults
      const [shapesCustomized, setShapesCustomized] = useState(false);

      // Color Slots
      const [colorSlots, setColorSlots] = useState([
        "#ef4444",
        "#3b82f6",
        "#10b981",
        "#ffffff"
      ]);
      const [activeColorIdx, setActiveColorIdx] = useState(0);
      const activeColor = colorSlots[activeColorIdx];

      // Saved Tool Customization Configurations (Uses Excalidraw's native strokeWidth scale: 1, 2, 4)
      const [toolConfigs, setToolConfigs] = useState({
        pen: {
          widthPresets: [1, 2, 4],
          activeWidthSlot: 1,
          strokeWidth: 2,
          opacity: 100,
          strokeType: "pressure" // "pressure" | "constant"
        },
        highlighter: {
          widthPresets: [4, 8, 12],
          activeWidthSlot: 1,
          strokeWidth: 8,
          opacity: 35,
          strokeType: "constant",
          color: "#facc15"
        },
        shapes: {
          widthPresets: [1, 2, 4],
          activeWidthSlot: 1,
          strokeWidth: 2,
          opacity: 100,
          strokeStyle: "solid",
          roughness: 0,
          fillStyle: "transparent"
        }
      });

      // Keep a live ref for the native capture-phase pointer listener
      const strokeModeRef = useRef({
        tool: "pen",
        penType: "pressure",
        hlType: "constant"
      });
      const isDrawingOnCanvasRef = useRef(false);

      useEffect(() => {
        strokeModeRef.current = {
          tool: activeTool,
          penType: toolConfigs.pen.strokeType,
          hlType: toolConfigs.highlighter.strokeType
        };
      }, [activeTool, toolConfigs.pen.strokeType, toolConfigs.highlighter.strokeType]);

      // Native Excalidraw Constant vs. Pressure Feed:
      // Tracks active canvas strokes from pointerdown through pointerup so pressure never drops mid-stroke.
      useEffect(() => {
        const applyConstantPressure = (e) => {
          try {
            Object.defineProperty(e, "pointerType", {
              get: () => "pen",
              configurable: true
            });
            Object.defineProperty(e, "pressure", {
              get: () => 0.22,
              configurable: true
            });
          } catch (err) {}
        };

        const onPointerDownCapture = (e) => {
          const target = e.target;
          const onCanvas = Boolean(target && target.closest && target.closest(".excalidraw__canvas"));
          if (!onCanvas) return;

          // If Fit Mode is ON, block secondary multi-touch pointers from panning/zooming mid-stroke
          if (isFitModeRef.current && e.isPrimary === false) {
            e.stopPropagation();
            e.preventDefault();
            return;
          }

          isDrawingOnCanvasRef.current = true;
          const { tool, penType, hlType } = strokeModeRef.current;
          if ((tool === "pen" && penType === "constant") || (tool === "highlighter" && hlType === "constant")) {
            applyConstantPressure(e);
          }
        };

        const onPointerMoveCapture = (e) => {
          if (isFitModeRef.current && isDrawingOnCanvasRef.current && e.isPrimary === false) {
            e.stopPropagation();
            e.preventDefault();
            return;
          }
          if (!isDrawingOnCanvasRef.current) return;
          const { tool, penType, hlType } = strokeModeRef.current;
          if ((tool === "pen" && penType === "constant") || (tool === "highlighter" && hlType === "constant")) {
            applyConstantPressure(e);
          }
        };

        const onPointerUpOrCancelCapture = (e) => {
          if (!isDrawingOnCanvasRef.current) return;
          const { tool, penType, hlType } = strokeModeRef.current;
          if ((tool === "pen" && penType === "constant") || (tool === "highlighter" && hlType === "constant")) {
            applyConstantPressure(e);
          }
          isDrawingOnCanvasRef.current = false;
        };

        window.addEventListener("pointerdown", onPointerDownCapture, { capture: true });
        window.addEventListener("pointermove", onPointerMoveCapture, { capture: true });
        window.addEventListener("pointerup", onPointerUpOrCancelCapture, { capture: true });
        window.addEventListener("pointercancel", onPointerUpOrCancelCapture, { capture: true });
        return () => {
          window.removeEventListener("pointerdown", onPointerDownCapture, { capture: true });
          window.removeEventListener("pointermove", onPointerMoveCapture, { capture: true });
          window.removeEventListener("pointerup", onPointerUpOrCancelCapture, { capture: true });
          window.removeEventListener("pointercancel", onPointerUpOrCancelCapture, { capture: true });
        };
      }, []);

      // Selection & Free-Draw Lasso State
      const [selectedIds, setSelectedIds] = useState([]);
      const selectedIdsRef = useRef([]);
      const [lassoPath, setLassoPath] = useState([]);
      const isDrawingLassoRef = useRef(false);
      const lassoPointsRef = useRef([]);

      // File Input & Scene Tracking Refs
      const fileInputRef = useRef(null);
      const imageInputRef = useRef(null);
      const bgImageInputRef = useRef(null);
      const isSwitchingPageRef = useRef(false);
      const currentBgMetaRef = useRef({ width: 1280, height: 720, id: "__page_bg_0__" });
      const processedStrokeIdsRef = useRef(new Set());

      // Helper to resolve which config bucket applies to a given tool
      const getConfigBucketName = (toolName) => {
        if (toolName === "highlighter") return "highlighter";
        if (SHAPE_TOOLS.includes(toolName)) return "shapes";
        return "pen";
      };

      // Sync theme attribute on document and Excalidraw canvas background
      useEffect(() => {
        document.documentElement.setAttribute("data-theme", uiTheme);
        if (excalidrawAPI) {
          excalidrawAPI.updateScene({
            appState: {
              viewBackgroundColor: uiTheme === "dark" ? "#121212" : "#e2e8f0"
            }
          });
        }
      }, [uiTheme, excalidrawAPI]);

      // Listen for native fullscreen exit (e.g. pressing Esc)
      useEffect(() => {
        const onFsChange = () => {
          if (!document.fullscreenElement) {
            setIsFullscreen(false);
          }
        };
        document.addEventListener("fullscreenchange", onFsChange);
        return () => document.removeEventListener("fullscreenchange", onFsChange);
      }, []);

      // Toggle Fullscreen (Hides Top Navbar while keeping Page Bar, Preview Bar & Annotation Bar)
      const toggleFullscreenMode = async () => {
        setOpenPopover(null);
        if (!isFullscreen) {
          setIsFullscreen(true);
          try {
            if (document.documentElement.requestFullscreen) {
              await document.documentElement.requestFullscreen();
            }
          } catch (e) {}
        } else {
          setIsFullscreen(false);
          try {
            if (document.fullscreenElement && document.exitFullscreen) {
              await document.exitFullscreen();
            }
          } catch (e) {}
        }
      };

      // Apply tool configuration directly to Excalidraw using its native freedraw & shape properties
      const applyToolToExcalidraw = useCallback((toolName, colorHex, configsOverride, lockOverride) => {
        if (!excalidrawAPI) return;
        const cfgs = configsOverride || toolConfigs;
        const keepLocked = lockOverride !== undefined ? lockOverride : toolLock;
        const bucket = getConfigBucketName(toolName);
        const cfg = cfgs[bucket] || cfgs.pen;

        if (toolName === "pen") {
          excalidrawAPI.updateScene({
            appState: {
              currentItemStrokeColor: colorHex,
              currentItemBackgroundColor: "transparent",
              currentItemStrokeWidth: cfg.strokeWidth,
              currentItemOpacity: cfg.opacity,
              currentItemStrokeStyle: "solid",
              currentItemRoughness: 0,
              activeTool: { type: "freedraw", customType: null, locked: keepLocked }
            }
          });
        } else if (toolName === "autoshape") {
          const sCfg = cfgs.shapes;
          excalidrawAPI.updateScene({
            appState: {
              currentItemStrokeColor: colorHex,
              currentItemBackgroundColor: sCfg.fillStyle !== "transparent" ? colorHex + "33" : "transparent",
              currentItemFillStyle: sCfg.fillStyle === "transparent" ? "solid" : sCfg.fillStyle,
              currentItemStrokeWidth: sCfg.strokeWidth,
              currentItemOpacity: sCfg.opacity,
              currentItemStrokeStyle: sCfg.strokeStyle,
              currentItemRoughness: sCfg.roughness,
              activeTool: { type: "freedraw", customType: null, locked: keepLocked }
            }
          });
        } else if (toolName === "highlighter") {
          const hCfg = cfgs.highlighter;
          excalidrawAPI.updateScene({
            appState: {
              currentItemStrokeColor: colorHex || hCfg.color || "#facc15",
              currentItemStrokeWidth: hCfg.strokeWidth,
              currentItemOpacity: hCfg.opacity,
              currentItemStrokeStyle: "solid",
              currentItemRoughness: 0,
              activeTool: { type: "freedraw", customType: null, locked: keepLocked }
            }
          });
        } else if (toolName === "lasso") {
          excalidrawAPI.setActiveTool({ type: "selection" });
        } else if (toolName === "rectangle" || toolName === "triangle") {
          const sCfg = cfgs.shapes;
          excalidrawAPI.updateScene({
            appState: {
              currentItemStrokeColor: colorHex,
              currentItemBackgroundColor: sCfg.fillStyle !== "transparent" ? colorHex + "33" : "transparent",
              currentItemFillStyle: sCfg.fillStyle === "transparent" ? "solid" : sCfg.fillStyle,
              currentItemStrokeWidth: sCfg.strokeWidth,
              currentItemOpacity: sCfg.opacity,
              currentItemStrokeStyle: sCfg.strokeStyle,
              currentItemRoughness: sCfg.roughness,
              activeTool: { type: "rectangle", customType: null, locked: keepLocked }
            }
          });
        } else if (toolName === "circle") {
          const sCfg = cfgs.shapes;
          excalidrawAPI.updateScene({
            appState: {
              currentItemStrokeColor: colorHex,
              currentItemBackgroundColor: sCfg.fillStyle !== "transparent" ? colorHex + "33" : "transparent",
              currentItemFillStyle: sCfg.fillStyle === "transparent" ? "solid" : sCfg.fillStyle,
              currentItemStrokeWidth: sCfg.strokeWidth,
              currentItemOpacity: sCfg.opacity,
              currentItemStrokeStyle: sCfg.strokeStyle,
              currentItemRoughness: sCfg.roughness,
              activeTool: { type: "ellipse", customType: null, locked: keepLocked }
            }
          });
        } else if (toolName === "arrow" || toolName === "line") {
          const sCfg = cfgs.shapes;
          excalidrawAPI.updateScene({
            appState: {
              currentItemStrokeColor: colorHex,
              currentItemStrokeWidth: sCfg.strokeWidth,
              currentItemOpacity: sCfg.opacity,
              currentItemStrokeStyle: sCfg.strokeStyle,
              currentItemRoughness: sCfg.roughness,
              activeTool: { type: toolName, customType: null, locked: keepLocked }
            }
          });
        } else if (toolName === "text") {
          excalidrawAPI.updateScene({
            appState: {
              currentItemStrokeColor: colorHex,
              currentItemOpacity: cfg.opacity,
              activeTool: { type: "text", customType: null, locked: keepLocked }
            }
          });
        } else if (toolName === "note") {
          excalidrawAPI.updateScene({
            appState: {
              currentItemStrokeColor: "#1e293b",
              currentItemBackgroundColor: "#fef08a",
              currentItemFillStyle: "solid",
              currentItemStrokeWidth: 2,
              currentItemOpacity: 100,
              currentItemRoughness: 0,
              activeTool: { type: "rectangle", customType: null, locked: keepLocked }
            }
          });
        } else if (toolName === "bucket") {
          excalidrawAPI.setActiveTool({ type: "selection" });
        } else if (toolName === "eraser") {
          excalidrawAPI.setActiveTool({ type: "eraser" });
        } else if (toolName === "laser") {
          excalidrawAPI.setActiveTool({ type: "laser" });
        } else if (toolName === "pan") {
          excalidrawAPI.setActiveTool({ type: "hand" });
        }
      }, [excalidrawAPI, toolConfigs, toolLock]);

      // Free-Draw Lasso Selection Handlers on the Canvas Container
      const screenToSceneCoords = useCallback((clientX, clientY) => {
        if (!excalidrawAPI) return [0, 0];
        const appState = excalidrawAPI.getAppState();
        if (
          window.ExcalidrawLib &&
          typeof window.ExcalidrawLib.viewportCoordsToSceneCoords === "function"
        ) {
          const pt = window.ExcalidrawLib.viewportCoordsToSceneCoords(
            { clientX, clientY },
            appState
          );
          return [pt.x, pt.y];
        }
        const zoom = (appState.zoom && appState.zoom.value) || 1;
        const offsetLeft = appState.offsetLeft || 0;
        const offsetTop = appState.offsetTop || 0;
        const scrollX = appState.scrollX || 0;
        const scrollY = appState.scrollY || 0;
        return [
          (clientX - offsetLeft) / zoom - scrollX,
          (clientY - offsetTop) / zoom - scrollY
        ];
      }, [excalidrawAPI]);

      const handleLassoPointerDownCapture = useCallback((e) => {
        if (activeTool !== "lasso" || !excalidrawAPI) return;
        if (e.button !== undefined && e.button !== 0) return;

        const appState = excalidrawAPI.getAppState();
        const selectedMap = appState.selectedElementIds || {};
        const currentSelIds = Object.keys(selectedMap).filter(
          (id) => selectedMap[id] && !String(id).startsWith("__page_bg_")
        );

        const [sceneX, sceneY] = screenToSceneCoords(e.clientX, e.clientY);
        const zoom = (appState.zoom && appState.zoom.value) || 1;

        // If elements are currently selected, ONLY pass through to Excalidraw if the user clicks
        // directly on the selection bounding box, resize handles, or top rotation handle.
        // Clicking anywhere else starts our custom Free-Draw Lasso (never Excalidraw's rectangle selection!).
        if (currentSelIds.length > 0) {
          const elements = excalidrawAPI.getSceneElements();
          const selectedEls = elements.filter(
            (el) => selectedMap[el.id] && !el.isDeleted && !String(el.id).startsWith("__page_bg_")
          );

          if (selectedEls.length > 0) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            selectedEls.forEach((el) => {
              const b = getElementSceneBounds(el);
              minX = Math.min(minX, b.minX);
              minY = Math.min(minY, b.minY);
              maxX = Math.max(maxX, b.maxX);
              maxY = Math.max(maxY, b.maxY);
            });

            const cx = (minX + maxX) / 2;
            const cy = (minY + maxY) / 2;
            // Account for element rotation when checking if pointer is on the box or rotation handle
            const commonAngle = selectedEls.length === 1 ? (selectedEls[0].angle || 0) : 0;
            const [localX, localY] = rotatePoint(sceneX, sceneY, cx, cy, -commonAngle);

            const handleTol = 16 / zoom;
            const onSelectionBox =
              localX >= minX - handleTol &&
              localX <= maxX + handleTol &&
              localY >= minY - handleTol &&
              localY <= maxY + handleTol;

            const onRotationHandle =
              Math.abs(localX - cx) <= 24 / zoom &&
              localY >= minY - 48 / zoom &&
              localY <= minY + handleTol;

            if (onSelectionBox || onRotationHandle) {
              return; // Let Excalidraw move, resize, or rotate the selected element(s)
            }
          }
        }

        // Start drawing a Free-Draw Lasso loop and capture the pointer so it never drops mid-stroke
        e.stopPropagation();
        e.preventDefault();
        try {
          if (e.currentTarget && e.currentTarget.setPointerCapture) {
            e.currentTarget.setPointerCapture(e.pointerId);
          }
        } catch (err) {}

        isDrawingLassoRef.current = true;
        const startPt = [[e.clientX, e.clientY]];
        lassoPointsRef.current = startPt;
        setLassoPath(startPt);
      }, [activeTool, excalidrawAPI, screenToSceneCoords]);

      const handleLassoPointerMoveCapture = useCallback((e) => {
        if (!isDrawingLassoRef.current) return;
        e.stopPropagation();
        e.preventDefault();
        const prevPts = lassoPointsRef.current;
        if (prevPts.length > 0) {
          const last = prevPts[prevPts.length - 1];
          if (Math.hypot(e.clientX - last[0], e.clientY - last[1]) < 3) {
            return;
          }
        }
        const nextPts = [...prevPts, [e.clientX, e.clientY]];
        lassoPointsRef.current = nextPts;
        setLassoPath(nextPts);
      }, []);

      const handleLassoPointerUpCapture = useCallback((e) => {
        if (!isDrawingLassoRef.current) return;
        e.stopPropagation();
        e.preventDefault();
        try {
          if (e.currentTarget && e.currentTarget.releasePointerCapture) {
            e.currentTarget.releasePointerCapture(e.pointerId);
          }
        } catch (err) {}

        isDrawingLassoRef.current = false;

        const currentPath = lassoPointsRef.current;
        lassoPointsRef.current = [];
        setLassoPath([]);

        if (!excalidrawAPI) return;

        // Measure total screen path length to distinguish a lasso loop from a single tap
        let screenLength = 0;
        for (let i = 1; i < currentPath.length; i++) {
          screenLength += Math.hypot(
            currentPath[i][0] - currentPath[i - 1][0],
            currentPath[i][1] - currentPath[i - 1][1]
          );
        }

        if (currentPath.length >= 3 && screenLength >= 16) {
          const scenePolygon = currentPath.map(([cx, cy]) => screenToSceneCoords(cx, cy));
          // Explicitly close the polygon loop
          scenePolygon.push(scenePolygon[0]);

          const elements = excalidrawAPI.getSceneElements();
          const newSelected = {};
          elements.forEach((el) => {
            if (isElementFullyInsideLasso(el, scenePolygon)) {
              newSelected[el.id] = true;
            }
          });
          const selKeys = Object.keys(newSelected);
          selectedIdsRef.current = selKeys;
          setSelectedIds(selKeys);
          excalidrawAPI.updateScene({
            appState: {
              selectedElementIds: newSelected,
              activeTool: { type: "selection", customType: null, locked: false }
            }
          });
        } else {
          // Single tap on empty space clears current selection
          selectedIdsRef.current = [];
          setSelectedIds([]);
          excalidrawAPI.updateScene({
            appState: { selectedElementIds: {} }
          });
        }
      }, [excalidrawAPI, screenToSceneCoords]);

      // Move selected elements Up/Down/Front/Back in Layer Order (Keeping locked page background at index 0)
      const handleMoveSelectionLayer = useCallback((direction) => {
        if (!excalidrawAPI) return;
        const appState = excalidrawAPI.getAppState();
        const selMap = appState.selectedElementIds || {};
        const activeSel = Object.keys(selMap).filter(
          (id) => selMap[id] && !String(id).startsWith("__page_bg_")
        );
        if (activeSel.length === 0) return;

        const elements = excalidrawAPI.getSceneElements();
        const bgElements = elements.filter((el) => String(el.id).startsWith("__page_bg_"));
        const userElements = elements.filter((el) => !String(el.id).startsWith("__page_bg_"));
        const selSet = new Set(activeSel);

        let reordered = [...userElements];

        if (direction === "front") {
          const unsel = reordered.filter((el) => !selSet.has(el.id));
          const sel = reordered.filter((el) => selSet.has(el.id));
          reordered = [...unsel, ...sel];
        } else if (direction === "back") {
          const unsel = reordered.filter((el) => !selSet.has(el.id));
          const sel = reordered.filter((el) => selSet.has(el.id));
          reordered = [...sel, ...unsel];
        } else if (direction === "up") {
          for (let i = reordered.length - 2; i >= 0; i--) {
            if (selSet.has(reordered[i].id) && !selSet.has(reordered[i + 1].id)) {
              const tmp = reordered[i];
              reordered[i] = reordered[i + 1];
              reordered[i + 1] = tmp;
            }
          }
        } else if (direction === "down") {
          for (let i = 1; i < reordered.length; i++) {
            if (selSet.has(reordered[i].id) && !selSet.has(reordered[i - 1].id)) {
              const tmp = reordered[i];
              reordered[i] = reordered[i - 1];
              reordered[i - 1] = tmp;
            }
          }
        }

        const finalElements = [...bgElements, ...reordered].map((el) => ({
          ...el,
          version: (el.version || 1) + 1,
          versionNonce: Math.floor(Math.random() * 100000000)
        }));

        excalidrawAPI.updateScene({
          elements: finalElements,
          appState: { selectedElementIds: selMap },
          commitToHistory: true
        });
      }, [excalidrawAPI]);

      const handleDeleteSelection = useCallback(() => {
        if (!excalidrawAPI) return;
        const appState = excalidrawAPI.getAppState();
        const selMap = appState.selectedElementIds || {};
        const selSet = new Set(
          Object.keys(selMap).filter((id) => selMap[id] && !String(id).startsWith("__page_bg_"))
        );
        if (selSet.size === 0) return;
        const updated = excalidrawAPI
          .getSceneElements()
          .filter((el) => !selSet.has(el.id));
        setSelectedIds([]);
        excalidrawAPI.updateScene({
          elements: updated,
          appState: { selectedElementIds: {} },
          commitToHistory: true
        });
      }, [excalidrawAPI]);

      // Select an Extra Tool from the Three-Dot Menu
      const handleSelectExtraTool = (toolId) => {
        if (toolId === "image") {
          setOpenPopover(null);
          if (imageInputRef.current) imageInputRef.current.click();
          return;
        }
        setLastExtraTool(toolId);
        setActiveTool(toolId);
        setEditingWidthSlot(false);
        setOpenPopover(null);
        applyToolToExcalidraw(toolId, activeColor);
      };

      // Choose Default Page Background Preset (Applies to new pages and updates current page if blank)
      const handleSelectBackgroundPreset = async (bgStyleId) => {
        const engine = engineRef.current;
        engine.setDefaultBackground(bgStyleId);
        setDefaultBgStyle(bgStyleId);

        const currentDesc = engine.pages[currentPage];
        if (currentDesc && currentDesc.type === "blank") {
          saveCurrentPageVectors(currentPage);
          engine.applyBackgroundToPage(currentPage, bgStyleId);
          await goToPage(currentPage, true);
        }
      };

      // Toggle UI Theme (Dark <-> Light) and sync default/blank page background to matching theme version
      const handleToggleTheme = async () => {
        const nextTheme = uiTheme === "dark" ? "light" : "dark";
        setUiTheme(nextTheme);

        // Also flip the 4th color slot between white (#ffffff) and dark slate (#1e293b) for high contrast
        setColorSlots((prevSlots) => {
          const nextSlots = [...prevSlots];
          if (nextTheme === "light" && nextSlots[3].toLowerCase() === "#ffffff") {
            nextSlots[3] = "#1e293b";
          } else if (nextTheme === "dark" && nextSlots[3].toLowerCase() === "#1e293b") {
            nextSlots[3] = "#ffffff";
          }
          return nextSlots;
        });

        const engine = engineRef.current;
        const mappedDefault = getOppositeThemeBgId(defaultBgStyle, nextTheme);
        engine.setDefaultBackground(mappedDefault);
        setDefaultBgStyle(mappedDefault);

        const currentDesc = engine.pages[currentPage];
        if (currentDesc && currentDesc.type === "blank" && currentDesc.bgStyle !== "custom") {
          saveCurrentPageVectors(currentPage);
          const mappedCurrent = getOppositeThemeBgId(currentDesc.bgStyle, nextTheme);
          engine.applyBackgroundToPage(currentPage, mappedCurrent);
          await goToPage(currentPage, true);
        }
      };

      // Handle Custom Background Image Upload
      const handleCustomBackgroundUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          const dataUrl = reader.result;
          const engine = engineRef.current;
          engine.setDefaultBackground("custom", dataUrl);
          setDefaultBgStyle("custom");
          setHasCustomBgImage(true);

          const currentDesc = engine.pages[currentPage];
          if (currentDesc && currentDesc.type === "blank") {
            saveCurrentPageVectors(currentPage);
            engine.applyBackgroundToPage(currentPage, "custom", dataUrl);
            await goToPage(currentPage, true);
          }
        };
        reader.readAsDataURL(file);
        e.target.value = "";
      };

      // Color Button Click Handler:
      // 1st click -> selects color for Pen/Highlighter/Active Shape (or switches to Pen if on Eraser/Pan/Laser).
      // 2nd click on ALREADY selected color -> opens Color Picker popover (Standard + Color Wheel)!
      const handleColorSlotClick = (slotIdx) => {
        const chosenColor = colorSlots[slotIdx];
        const canUseColor =
          activeTool === "pen" ||
          activeTool === "highlighter" ||
          SHAPE_TOOLS.includes(activeTool) ||
          activeTool === "text" ||
          activeTool === "bucket";

        if (activeColorIdx === slotIdx && canUseColor) {
          setOpenPopover(openPopover === "color" ? null : "color");
        } else {
          setActiveColorIdx(slotIdx);
          setOpenPopover(null);
          const nextTool = canUseColor ? activeTool : "pen";
          setActiveTool(nextTool);
          applyToolToExcalidraw(nextTool, chosenColor);
        }
      };

      // Update the active color slot from standard palette or color wheel
      const updateActiveColorSlot = (newHex) => {
        const updated = [...colorSlots];
        updated[activeColorIdx] = newHex;
        setColorSlots(updated);
        const canUseColor =
          activeTool === "pen" ||
          activeTool === "highlighter" ||
          SHAPE_TOOLS.includes(activeTool) ||
          activeTool === "text" ||
          activeTool === "bucket";
        const targetTool = canUseColor ? activeTool : "pen";
        applyToolToExcalidraw(targetTool, newHex);
      };

      // Tool Button Click Handler:
      // 1st click -> activates tool silently with saved settings.
      // 2nd click on ALREADY active customizable tool -> toggles customization popover!
      const handleToolClick = (toolName) => {
        const isCustomizable =
          toolName === "pen" ||
          toolName === "highlighter" ||
          SHAPE_TOOLS.includes(toolName);

        if (activeTool === toolName) {
          if (isCustomizable) {
            setEditingWidthSlot(false);
            setOpenPopover(openPopover === "tool" ? null : "tool");
          } else {
            setOpenPopover(null);
          }
          return;
        }

        setActiveTool(toolName);
        setEditingWidthSlot(false);
        setOpenPopover(null);
        applyToolToExcalidraw(toolName, activeColor);
      };

      // Update a property inside toolConfigs (Syncs Pen -> Shapes unless Shapes was independently customized)
      const updateToolConfig = (key, value) => {
        const bucket = getConfigBucketName(activeTool);
        const updatedBucket = {
          ...toolConfigs[bucket],
          [key]: value
        };
        const nextConfigs = {
          ...toolConfigs,
          [bucket]: updatedBucket
        };

        // By default, Pen settings also propagate to Shapes until Shapes are explicitly customized
        if (bucket === "pen" && !shapesCustomized && (key === "strokeWidth" || key === "opacity")) {
          nextConfigs.shapes = {
            ...toolConfigs.shapes,
            [key]: value
          };
        } else if (bucket === "shapes") {
          setShapesCustomized(true);
        }

        setToolConfigs(nextConfigs);
        applyToolToExcalidraw(activeTool, activeColor, nextConfigs);
      };

      // 3 Stroke Width Preset Slots:
      // 1st click selects that preset width; 2nd click on active slot opens fine-tuning slider
      const handleWidthSlotClick = (slotIdx) => {
        const bucket = getConfigBucketName(activeTool);
        const currentBucketCfg = toolConfigs[bucket] || toolConfigs.pen;

        if (currentBucketCfg.activeWidthSlot === slotIdx) {
          setEditingWidthSlot(!editingWidthSlot);
          return;
        }

        setEditingWidthSlot(false);
        const newWidth = currentBucketCfg.widthPresets[slotIdx];

        const nextBucket = {
          ...toolConfigs[bucket],
          activeWidthSlot: slotIdx,
          strokeWidth: newWidth
        };
        const nextConfigs = {
          ...toolConfigs,
          [bucket]: nextBucket
        };
        if (bucket === "pen" && !shapesCustomized) {
          nextConfigs.shapes = {
            ...toolConfigs.shapes,
            activeWidthSlot: slotIdx,
            strokeWidth: newWidth
          };
        } else if (bucket === "shapes") {
          setShapesCustomized(true);
        }

        setToolConfigs(nextConfigs);
        applyToolToExcalidraw(activeTool, activeColor, nextConfigs);
      };

      const handleCustomWidthSliderChange = (newWidthVal) => {
        const bucket = getConfigBucketName(activeTool);
        const cur = toolConfigs[bucket];
        const newPresets = [...cur.widthPresets];
        newPresets[cur.activeWidthSlot] = newWidthVal;

        const nextConfigs = {
          ...toolConfigs,
          [bucket]: {
            ...cur,
            widthPresets: newPresets,
            strokeWidth: newWidthVal
          }
        };

        if (bucket === "pen" && !shapesCustomized) {
          const shapePresets = [...toolConfigs.shapes.widthPresets];
          shapePresets[cur.activeWidthSlot] = newWidthVal;
          nextConfigs.shapes = {
            ...toolConfigs.shapes,
            widthPresets: shapePresets,
            strokeWidth: newWidthVal
          };
        } else if (bucket === "shapes") {
          setShapesCustomized(true);
        }

        setToolConfigs(nextConfigs);
        applyToolToExcalidraw(activeTool, activeColor, nextConfigs);
      };

      // Save current page vector strokes (excludes the locked page background)
      const saveCurrentPageVectors = useCallback((pageIdx) => {
        if (!excalidrawAPI) return;
        const elements = excalidrawAPI.getSceneElements();
        const strokesOnly = elements.filter(
          (el) => !el.isDeleted && !String(el.id).startsWith("__page_bg_")
        );
        engineRef.current.pageVectors[pageIdx] = strokesOnly;
      }, [excalidrawAPI]);

      // Compute exact 100% edge-to-edge viewport fit with integer-aligned scroll offsets
      const computeExactFitAppState = useCallback((bgElOverride = null) => {
        const bgW = (bgElOverride && bgElOverride.width) || currentBgMetaRef.current.width || 1280;
        const bgH = (bgElOverride && bgElOverride.height) || currentBgMetaRef.current.height || 720;
        const vw = window.innerWidth || 1280;
        const vh = window.innerHeight || 720;
        const rawZoom = Math.min(vw / bgW, vh / bgH);
        const exactZoom = Math.abs(rawZoom - 1) < 0.005 ? 1 : rawZoom;
        const scrollX = Math.round(vw / (2 * exactZoom) - bgW / 2);
        const scrollY = Math.round(vh / (2 * exactZoom) - bgH / 2);
        return {
          zoom: { value: exactZoom },
          scrollX,
          scrollY
        };
      }, []);

      // Center & fit the locked 4K page cleanly to 100% of the screen viewport
      const fitPageToScreen = useCallback((bgElOverride = null) => {
        if (!excalidrawAPI) return;
        const elements = excalidrawAPI.getSceneElements();
        const targetEl =
          bgElOverride ||
          elements.find((el) => String(el.id).startsWith("__page_bg_"));
        if (targetEl) {
          const fitState = computeExactFitAppState(targetEl);
          excalidrawAPI.updateScene({
            appState: fitState
          });
        }
      }, [excalidrawAPI, computeExactFitAppState]);

      // Toggle Fit Mode ON (locked full-screen page) vs OFF (unlocked infinite canvas)
      const handleToggleFitMode = useCallback(() => {
        const nextFit = !isFitModeRef.current;
        isFitModeRef.current = nextFit;
        setIsFitMode(nextFit);
        if (nextFit) {
          fitPageToScreen();
        }
      }, [fitPageToScreen]);

      // Re-fit automatically on window resize or Fullscreen change when Fit Mode is ON
      useEffect(() => {
        const onResize = () => {
          if (isFitModeRef.current) {
            fitPageToScreen();
          }
        };
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, [fitPageToScreen]);

      // Prevent wheel scroll/zoom and multi-touch pinch-zoom from moving the page while Fit Mode is ON
      useEffect(() => {
        const onWheelCapture = (e) => {
          if (!isFitModeRef.current) return;
          const target = e.target;
          if (target && target.closest && target.closest(".excalidraw__canvas")) {
            e.preventDefault();
            e.stopPropagation();
          }
        };
        const onTouchMoveCapture = (e) => {
          if (!isFitModeRef.current) return;
          if (e.touches && e.touches.length > 1) {
            const target = e.target;
            if (target && target.closest && target.closest(".excalidraw__canvas")) {
              e.preventDefault();
              e.stopPropagation();
            }
          }
        };
        window.addEventListener("wheel", onWheelCapture, { passive: false, capture: true });
        window.addEventListener("touchmove", onTouchMoveCapture, { passive: false, capture: true });
        return () => {
          window.removeEventListener("wheel", onWheelCapture, { capture: true });
          window.removeEventListener("touchmove", onTouchMoveCapture, { capture: true });
        };
      }, []);

      // Navigate to any page index in 4K resolution while keeping RAM low
      const goToPage = useCallback(async (targetIdx, forceReload = false) => {
        if (!excalidrawAPI) return;
        const engine = engineRef.current;
        if (targetIdx < 0 || targetIdx >= engine.pages.length) return;
        if (targetIdx === currentPage && !forceReload) return;

        try {
          isSwitchingPageRef.current = true;
          setIsBusy(true);
          if (!forceReload) {
            saveCurrentPageVectors(currentPage);
          }

          const isCached = Boolean(engine.preRasterizedCache[targetIdx]);
          if (!isCached) {
            setStatusMessage(`Rendering Page ${targetIdx + 1} in 4K...`);
          }

          const bitmap = await engine.renderPage4K(targetIdx, rasterizeMode === "all");
          const fileId = `page_4k_${targetIdx}_${Date.now()}`;
          const bgElement = createLockedPageElement(
            targetIdx,
            fileId,
            bitmap.width,
            bitmap.height
          );

          currentBgMetaRef.current = {
            width: bitmap.width,
            height: bitmap.height,
            id: bgElement.id
          };

          excalidrawAPI.addFiles([
            {
              id: fileId,
              dataURL: bitmap.dataURL,
              mimeType: bitmap.mimeType,
              created: Date.now(),
              lastRetrieved: Date.now()
            }
          ]);

          const savedStrokes = (engine.pageVectors[targetIdx] || []).map((el) => ({
            ...el,
            version: (el.version || 1) + 1,
            versionNonce: Math.floor(Math.random() * 1000000000)
          }));

          excalidrawAPI.updateScene({
            elements: [bgElement, ...savedStrokes],
            commitToHistory: false
          });

          // Sync thumbnail cache state for preview drawer
          if (engine.thumbnailCache[targetIdx]) {
            setThumbnails((prev) => ({ ...prev, [targetIdx]: engine.thumbnailCache[targetIdx] }));
          }

          setCurrentPage(targetIdx);
          setTotalPages(engine.pages.length);

          requestAnimationFrame(() => {
            applyToolToExcalidraw(activeTool, activeColor);
            if (isFitModeRef.current) {
              requestAnimationFrame(() => {
                fitPageToScreen(bgElement);
                isSwitchingPageRef.current = false;
                setStatusMessage("");
                setIsBusy(false);
              });
            } else {
              isSwitchingPageRef.current = false;
              setStatusMessage("");
              setIsBusy(false);
            }
          });
        } catch (err) {
          console.error(err);
          isSwitchingPageRef.current = false;
          setIsBusy(false);
          setStatusMessage("Could not render page");
          setTimeout(() => setStatusMessage(""), 2500);
        }
      }, [excalidrawAPI, currentPage, rasterizeMode, saveCurrentPageVectors, fitPageToScreen, applyToolToExcalidraw, activeTool, activeColor]);

      // Initialize first page when Excalidraw mounts
      useEffect(() => {
        if (excalidrawAPI) {
          goToPage(0, true);
        }
      }, [excalidrawAPI]);

      // Lazily populate low-res thumbnails when the Preview Drawer opens
      useEffect(() => {
        if (!showPreviewDrawer) return;
        let cancelled = false;
        const engine = engineRef.current;

        (async () => {
          for (let i = 0; i < engine.pages.length; i++) {
            if (cancelled) break;
            if (!engine.thumbnailCache[i]) {
              const url = await engine.renderLowResThumbnail(i);
              if (!cancelled) {
                setThumbnails((prev) => ({ ...prev, [i]: url }));
              }
            } else if (!thumbnails[i]) {
              setThumbnails((prev) => ({ ...prev, [i]: engine.thumbnailCache[i] }));
            }
          }
        })();

        return () => { cancelled = true; };
      }, [showPreviewDrawer, totalPages]);

      // Handle PDF File Import (Supports both On-Demand 4K and Pre-Rasterize Whole PDF 4K)
      const handleFileUpload = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        setOpenPopover(null);
        setIsBusy(true);
        setStatusMessage(`Loading "${file.name}"...`);

        try {
          const buffer = await file.arrayBuffer();
          const count = await engineRef.current.loadPdfBuffer(buffer);
          setTotalPages(count);
          setThumbnails({});

          // If user chose "Pre-Rasterize Whole PDF", render all pages at 4K upfront so zero loading later
          if (rasterizeMode === "all") {
            for (let i = 0; i < count; i++) {
              setStatusMessage(`Pre-rasterizing 4K PDF: Page ${i + 1} of ${count}...`);
              await engineRef.current.renderPage4K(i, true);
              setThumbnails((prev) => ({ ...prev, [i]: engineRef.current.thumbnailCache[i] }));
            }
          }

          await goToPage(0, true);
        } catch (err) {
          setStatusMessage("Failed to load PDF: " + err.message);
          setTimeout(() => setStatusMessage(""), 3500);
          setIsBusy(false);
        } finally {
          e.target.value = "";
        }
      };

      // Toggle between On-Demand 4K and Pre-Rasterize Whole PDF 4K
      const handleToggleRasterizeMode = async () => {
        const nextMode = rasterizeMode === "lazy" ? "all" : "lazy";
        setRasterizeMode(nextMode);

        const engine = engineRef.current;
        if (nextMode === "lazy") {
          // Free pre-rasterized 4K bitmaps immediately to reclaim RAM
          engine.preRasterizedCache = {};
          setStatusMessage("Switched to On-Demand 4K Mode (Low RAM)");
          setTimeout(() => setStatusMessage(""), 2200);
        } else if (engine.pages.length > 1) {
          // Pre-rasterize all pages right now so subsequent page turns are instant
          setOpenPopover(null);
          setIsBusy(true);
          for (let i = 0; i < engine.pages.length; i++) {
            setStatusMessage(`Pre-rasterizing 4K Page ${i + 1} of ${engine.pages.length}...`);
            await engine.renderPage4K(i, true);
            setThumbnails((prev) => ({ ...prev, [i]: engine.thumbnailCache[i] }));
          }
          setIsBusy(false);
          setStatusMessage("All pages pre-rasterized in 4K!");
          setTimeout(() => setStatusMessage(""), 2200);
        }
      };

      // Insert Blank / Default-Background Page
      const handleInsertBlankPage = async (overrideStyle = null) => {
        if (!excalidrawAPI || isBusy) return;
        setOpenPopover(null);
        saveCurrentPageVectors(currentPage);
        const newIdx = engineRef.current.insertBlankPageAfter(currentPage, overrideStyle);
        setTotalPages(engineRef.current.pages.length);
        await goToPage(newIdx, true);
      };

      // Clear all annotations on current page
      const handleClearCurrentPageAnnotations = () => {
        if (!excalidrawAPI) return;
        setOpenPopover(null);
        const bgEl = excalidrawAPI.getSceneElements().find((el) =>
          String(el.id).startsWith("__page_bg_")
        );
        if (bgEl) {
          engineRef.current.pageVectors[currentPage] = [];
          excalidrawAPI.updateScene({ elements: [bgEl] });
        }
      };

      // Handle inserting an image onto the current page canvas
      const handleInsertImageFile = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file || !excalidrawAPI) return;

        const reader = new FileReader();
        reader.onload = () => {
          const dataURL = reader.result;
          const img = new Image();
          img.onload = () => {
            const fileId = "img_" + Date.now();
            excalidrawAPI.addFiles([
              {
                id: fileId,
                dataURL,
                mimeType: file.type || "image/png",
                created: Date.now(),
                lastRetrieved: Date.now()
              }
            ]);

            const maxDim = 640;
            const scale = Math.min(1, maxDim / Math.max(img.width || 400, img.height || 400));
            const w = Math.round((img.width || 400) * scale);
            const h = Math.round((img.height || 400) * scale);

            const bgMeta = currentBgMetaRef.current;
            const newImgEl = {
              id: "user_img_" + Date.now(),
              type: "image",
              x: Math.round((bgMeta.width - w) / 2),
              y: Math.round((bgMeta.height - h) / 2),
              width: w,
              height: h,
              angle: 0,
              strokeColor: "transparent",
              backgroundColor: "transparent",
              fillStyle: "solid",
              strokeWidth: 1,
              strokeStyle: "solid",
              roughness: 0,
              opacity: 100,
              groupIds: [],
              frameId: null,
              roundness: null,
              seed: Math.floor(Math.random() * 100000),
              version: 1,
              versionNonce: Math.floor(Math.random() * 100000000),
              isDeleted: false,
              boundElements: null,
              updated: Date.now(),
              link: null,
              locked: false,
              fileId,
              scale: [1, 1],
              status: "saved"
            };

            const existing = excalidrawAPI.getSceneElements();
            excalidrawAPI.updateScene({
              elements: [...existing, newImgEl],
              commitToHistory: true
            });
          };
          img.src = dataURL;
        };
        reader.readAsDataURL(file);
        e.target.value = "";
      };

      // Guard the locked page background and track selected elements without ever interrupting active strokes
      const handleExcalidrawChange = useCallback((elements, appState) => {
        if (isSwitchingPageRef.current || !excalidrawAPI) return;

        // Never run scene updates or state reconciliation while the user is actively drawing or dragging
        if (
          isDrawingOnCanvasRef.current ||
          (appState && (appState.draggingElement || appState.newElement || appState.editingElement))
        ) {
          return;
        }

        // Track currently selected non-background elements
        if (appState && appState.selectedElementIds) {
          const selKeys = Object.keys(appState.selectedElementIds).filter(
            (id) => appState.selectedElementIds[id] && !String(id).startsWith("__page_bg_")
          );
          const prevKeys = selectedIdsRef.current;
          if (
            selKeys.length !== prevKeys.length ||
            selKeys.some((k, idx) => k !== prevKeys[idx])
          ) {
            selectedIdsRef.current = selKeys;
            setSelectedIds(selKeys);
          }
        }

        const expectedId = `__page_bg_${currentPage}__`;
        const bgEl = elements.find((el) => el.id === expectedId);

        const bgNeedsRestore =
          bgEl &&
          (bgEl.isDeleted || !bgEl.locked || bgEl.x !== 0 || bgEl.y !== 0);

        if (bgNeedsRestore) {
          const restoredElements = elements.map((el) =>
            el.id === expectedId
              ? {
                  ...el,
                  isDeleted: false,
                  locked: true,
                  x: 0,
                  y: 0,
                  width: currentBgMetaRef.current.width,
                  height: currentBgMetaRef.current.height
                }
              : el
          );

          excalidrawAPI.updateScene({
            elements: restoredElements,
            commitToHistory: false
          });
        }
      }, [excalidrawAPI, currentPage]);

      // PointerUp Handler ONLY for Bucket Fill, Auto Shape Recognizer, Triangle, & Sticky Note
      // Leaves Pen & Highlighter 100% untouched so native Excalidraw real-time freedraw works natively
      const handleCanvasPointerUp = useCallback(() => {
        if (!excalidrawAPI) return;
        if (
          activeTool !== "bucket" &&
          activeTool !== "autoshape" &&
          activeTool !== "triangle" &&
          activeTool !== "note"
        ) {
          return;
        }

        setTimeout(() => {
          const elements = excalidrawAPI.getSceneElements();
          const appState = excalidrawAPI.getAppState();

          // 1. BUCKET FILL MODE: Fill any clicked/selected element with the active color
          if (activeTool === "bucket") {
            const selectedIdsMap = appState.selectedElementIds || {};
            const targetIds = Object.keys(selectedIdsMap).filter(
              (id) => selectedIdsMap[id] && !String(id).startsWith("__page_bg_")
            );
            if (targetIds.length > 0) {
              const updated = elements.map((el) =>
                targetIds.includes(el.id)
                  ? {
                      ...el,
                      backgroundColor: activeColor,
                      fillStyle: "solid",
                      version: (el.version || 1) + 1,
                      versionNonce: Math.floor(Math.random() * 100000000)
                    }
                  : el
              );
              excalidrawAPI.updateScene({
                elements: updated,
                appState: { selectedElementIds: {} },
                commitToHistory: true
              });
            }
            return;
          }

          // 2. AUTO SHAPE RECOGNIZER MODE
          if (activeTool === "autoshape") {
            for (let i = elements.length - 1; i >= 0; i--) {
              const el = elements[i];
              if (!el.isDeleted && el.type === "freedraw" && !processedStrokeIdsRef.current.has(el.id)) {
                processedStrokeIdsRef.current.add(el.id);
                const recognizedShape = recognizeAndCreateGeometricElement(el, toolConfigs.shapes);
                if (recognizedShape) {
                  const updatedElements = elements.map((item) =>
                    item.id === el.id ? recognizedShape : item
                  );
                  excalidrawAPI.updateScene({
                    elements: updatedElements,
                    commitToHistory: true
                  });
                }
                break;
              }
            }
            return;
          }

          // 4. TRIANGLE CREATION TOOL (Converts drawn rectangle guide into crisp geometric triangle)
          if (activeTool === "triangle") {
            for (let i = elements.length - 1; i >= 0; i--) {
              const el = elements[i];
              if (!el.isDeleted && el.type === "rectangle" && !processedStrokeIdsRef.current.has(el.id)) {
                processedStrokeIdsRef.current.add(el.id);
                const w = Math.max(20, el.width);
                const h = Math.max(20, el.height);
                const triangleEl = {
                  ...el,
                  id: "tri_" + Date.now(),
                  type: "line",
                  width: w,
                  height: h,
                  points: [[w / 2, 0], [w, h], [0, h], [w / 2, 0]],
                  lastCommittedPoint: null,
                  startBinding: null,
                  endBinding: null,
                  startArrowhead: null,
                  endArrowhead: null,
                  version: (el.version || 1) + 1,
                  versionNonce: Math.floor(Math.random() * 100000000)
                };
                const updated = elements.map((item) => (item.id === el.id ? triangleEl : item));
                excalidrawAPI.updateScene({ elements: updated, commitToHistory: true });
                excalidrawAPI.setActiveTool({ type: "rectangle" });
                break;
              }
            }
            return;
          }

          // 5. STICKY NOTE TOOL (Ensures drawn note stays ready for annotations)
          if (activeTool === "note") {
            for (let i = elements.length - 1; i >= 0; i--) {
              const el = elements[i];
              if (!el.isDeleted && el.type === "rectangle" && !processedStrokeIdsRef.current.has(el.id)) {
                processedStrokeIdsRef.current.add(el.id);
                const updated = elements.map((item) =>
                  item.id === el.id
                    ? {
                        ...item,
                        backgroundColor: "#fef08a",
                        fillStyle: "solid",
                        strokeColor: "#eab308",
                        roundness: { type: 3 }
                      }
                    : item
                );
                excalidrawAPI.updateScene({ elements: updated, commitToHistory: true });
                break;
              }
            }
          }
        }, 25);
      }, [excalidrawAPI, activeTool, activeColor, toolConfigs]);

      // Export all pages + annotations to PDF
      const handleExportAnnotatedPdf = async () => {
        if (!excalidrawAPI || isBusy) return;
        setOpenPopover(null);
        saveCurrentPageVectors(currentPage);

        const engine = engineRef.current;
        const { jsPDF } = window.jspdf;
        setIsBusy(true);

        try {
          let pdfOut = null;
          for (let i = 0; i < engine.pages.length; i++) {
            setStatusMessage(`Exporting 4K PDF Page ${i + 1} of ${engine.pages.length}...`);
            const bitmap = await engine.renderPage4K(i, false);
            const fileId = `export_file_${i}`;
            const bgEl = createLockedPageElement(i, fileId, bitmap.width, bitmap.height);
            const strokes = engine.pageVectors[i] || [];
            const exportWidth = bitmap.pixelWidth || bitmap.width;
            const exportHeight = bitmap.pixelHeight || bitmap.height;
            const exportScale = exportWidth / bitmap.width;

            const exportCanvas = await window.ExcalidrawLib.exportToCanvas({
              elements: [bgEl, ...strokes],
              appState: {
                exportBackground: true,
                viewBackgroundColor: "#ffffff"
              },
              getDimensions: () => ({
                width: exportWidth,
                height: exportHeight,
                scale: exportScale
              }),
              files: {
                [fileId]: {
                  id: fileId,
                  dataURL: bitmap.dataURL,
                  mimeType: bitmap.mimeType,
                  created: Date.now()
                }
              }
            });

            const imgData = exportCanvas.toDataURL("image/jpeg", 0.90);
            const orientation = exportWidth > exportHeight ? "l" : "p";

            if (i === 0) {
              pdfOut = new jsPDF({
                orientation,
                unit: "px",
                format: [exportWidth, exportHeight],
                compress: true
              });
            } else {
              pdfOut.addPage([exportWidth, exportHeight], orientation);
            }

            pdfOut.addImage(imgData, "JPEG", 0, 0, exportWidth, exportHeight);
            exportCanvas.width = 0;
            exportCanvas.height = 0;
          }

          pdfOut.save(`ExcaliNote3-4K-${new Date().toISOString().slice(0, 10)}.pdf`);
          setStatusMessage("PDF Exported Successfully!");
          setTimeout(() => setStatusMessage(""), 2500);
        } catch (err) {
          setStatusMessage("Export error: " + err.message);
          setTimeout(() => setStatusMessage(""), 3500);
        } finally {
          setIsBusy(false);
        }
      };

        setOpenPopover(null);

        try {
          const libs = [
            { id: "lib-react", url: "https://unpkg.com/react@18.2.0/umd/react.production.min.js" },
            { id: "lib-react-dom", url: "https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" },
            { id: "lib-excalidraw", url: "https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js" },
            { id: "lib-pdfjs", url: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" },
            { id: "lib-jspdf", url: "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" }
          ];
          const workerUrl = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

          const cloneDoc = document.documentElement.cloneNode(true);
          const cloneRoot = cloneDoc.querySelector("#root");
          if (cloneRoot) cloneRoot.innerHTML = "";

          for (let i = 0; i < libs.length; i++) {
            setStatusMessage(`Bundling offline library ${i + 1} of ${libs.length + 1}...`);
            const res = await fetch(libs[i].url);
            const code = await res.text();
            const scriptEl = cloneDoc.querySelector(`#${libs[i].id}`);
            if (scriptEl) {
              scriptEl.removeAttribute("src");
              scriptEl.removeAttribute("crossorigin");
              scriptEl.textContent = code.replace(/<\/script/gi, "<\\/script");
            }
          }

          const workerRes = await fetch(workerUrl);
          const workerCode = await workerRes.text();
          let workerHolder = cloneDoc.querySelector("#inline-pdf-worker");
          if (!workerHolder) {
            workerHolder = document.createElement("script");
            workerHolder.id = "inline-pdf-worker";
            workerHolder.type = "text/plain";
            cloneDoc.querySelector("head").appendChild(workerHolder);
          }
          workerHolder.textContent = workerCode.replace(/<\/script/gi, "<\\/script");

          const finalHtml = "<!DOCTYPE html>\n" + cloneDoc.outerHTML;
          const blob = new Blob([finalHtml], { type: "text/html;charset=utf-8" });
          const downloadUrl = URL.createObjectURL(blob);

          const a = document.createElement("a");
          a.href = downloadUrl;
          a.download = "ExcaliNote3_4K_Offline.html";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(downloadUrl);

          setStatusMessage("Offline USB HTML downloaded!");
          setTimeout(() => setStatusMessage(""), 3000);

          setStatusMessage("Offline bundle failed: check connection");
          setTimeout(() => setStatusMessage(""), 3500);

                    className: "tool-grid-btn",
                    onClick: () => setOpenPopover("background"),
                    title: "Page Background Presets & Custom Image"
                  },
                  Icons.backgroundGrid()
                ),
                // Theme Toggle Icon (Quick access in Fullscreen too)
                h(
                  "button",
                  {
                    className: "tool-grid-btn",
                    onClick: handleToggleTheme,
                    title: uiTheme === "dark" ? "Switch to Light Mode" : "Switch to Dark Mode"
                  },
                  uiTheme === "dark" ? Icons.sun() : Icons.moon()
                ),
                // Fullscreen Enter/Exit Icon
                h(
                  "button",
                  {
                    className: `tool-grid-btn ${isFullscreen ? "active" : ""}`,
                    onClick: toggleFullscreenMode,
                    title: isFullscreen ? "Exit Fullscreen" : "Enter Fullscreen"
                  },
                  isFullscreen ? Icons.fullscreenExit() : Icons.fullscreenEnter()
                )
              )
            )
          : null,

        // =====================================================================
        // POPOVER 4: PAGE BACKGROUND SELECTOR (Dark First in Dark Mode, Light First in Light Mode)
        // =====================================================================
        openPopover === "background"
          ? h(
              "div",
              {
                className: "exc-popover",
                style: { "--pop-x": "-25%", width: "268px" }
              },
              h(
                "div",
                { className: "option-row", style: { justifyContent: "space-between", marginBottom: "6px" } },
                h(
                  "button",
                  {
                    className: "option-pill",
                    style: { flex: "none", width: "32px" },
                    onClick: () => setOpenPopover("menu"),
                    title: "Back"
                  },
                  Icons.chevronLeft()
                ),
                h(
                  "span",
                  { style: { fontSize: "11px", fontWeight: 600, color: "var(--icon-muted)" } },
                  uiTheme === "dark" ? "Dark & Light Backgrounds" : "Light & Dark Backgrounds"
                ),
                h(
                  "button",
                  {
                    className: "option-pill",
                    style: { flex: "none", width: "32px" },
                    onClick: () => bgImageInputRef.current && bgImageInputRef.current.click(),
                    title: "Upload Custom Background Image"
                  },
                  Icons.image()
                )
              ),
              h(
                "div",
                { className: "bg-preset-grid" },
                hasCustomBgImage
                  ? h(
                      "div",
                      {
                        className: `bg-preset-card ${defaultBgStyle === "custom" ? "active" : ""}`,
                        style: {
                          backgroundImage: `url(${engineRef.current.defaultBg.customBgDataUrl})`,
                          backgroundSize: "cover",
                          backgroundPosition: "center"
                        },
                        onClick: () => handleSelectBackgroundPreset("custom"),
                        title: "Custom Uploaded Background"
                      },
                      h("span", { className: "bg-preset-label" }, "Custom")
                    )
                  : null,
                sortedBgPresets.map((preset) =>
                  h(
                    "div",
                    {
                      key: preset.id,
                      className: `bg-preset-card ${defaultBgStyle === preset.id ? "active" : ""}`,
                      style: { background: preset.bg },
                      onClick: () => handleSelectBackgroundPreset(preset.id),
                      title: preset.label
                    },
                    h("span", { className: "bg-preset-label" }, preset.label)
                  )
                )
              )
            )
          : null,

        // =====================================================================
        // BOTTOM-LEFT ISLAND: PREV / NEXT PAGE + PLUS (+) ADD EMPTY PAGE BUTTON
        // Always remains visible in Fullscreen Mode for smooth online teaching!
        // =====================================================================
        h(
          "div",
          { className: "exc-island dock-left" },
          h(
            "button",
            {
              className: "exc-btn",
              disabled: isBusy || currentPage <= 0,
              onClick: () => goToPage(currentPage - 1),
              title: "Previous Page"
            },
            Icons.chevronLeft()
          ),
          h(
            "div",
            { className: "page-counter" },
            h("input", {
              className: "page-num-input",
              type: "number",
              min: 1,
              max: totalPages,
              value: currentPage + 1,
              onChange: (e) => {
                const val = parseInt(e.target.value, 10);
                if (!isNaN(val) && val >= 1 && val <= totalPages) {
                  goToPage(val - 1);
                }
              },
              title: "Jump to page number"
            }),
            h("span", { style: { color: "var(--icon-muted)" } }, `/ ${totalPages}`)
          ),
          h(
            "button",
            {
              className: "exc-btn",
              disabled: isBusy || currentPage >= totalPages - 1,
              onClick: () => goToPage(currentPage + 1),
              title: "Next Page"
            },
            Icons.chevronRight()
          ),
          h("div", { className: "exc-divider" }),
          h(
            "button",
            {
              className: "exc-btn",
              disabled: isBusy,
              onClick: () => handleInsertBlankPage(),
              title: "Add New Page"
            },
            Icons.plus()
          )
        ),

        // =====================================================================
        // BOTTOM-CENTER ANNOTATION BAR (Monochromatic Excalidraw-Style Dock)
        // Order: Auto Shape -> Pen -> Eraser -> Laser -> Lasso Selection -> Colors -> Clear All -> Three Dots
        // =====================================================================
        h(
          "div",
          { className: "exc-island dock-center" },

          // 1. Auto Shape Recognizer
          h(
            "button",
            {
              className: `exc-btn customizable ${activeTool === "autoshape" ? "active" : ""}`,
              onClick: () => handleToolClick("autoshape"),
              title: "Auto Shape Recognizer (Click again to customize)"
            },
            Icons.autoShape()
          ),

          // 2. Pen Tool
          h(
            "button",
            {
              className: `exc-btn customizable ${activeTool === "pen" ? "active" : ""}`,
              onClick: () => handleToolClick("pen"),
              title: "Pen (Click again to customize width, pressure & opacity)"
            },
            Icons.pen()
          ),

          // 3. Eraser Tool
          h(
            "button",
            {
              className: `exc-btn ${activeTool === "eraser" ? "active" : ""}`,
              onClick: () => handleToolClick("eraser"),
              title: "Eraser"
            },
            Icons.eraser()
          ),

          // 4. Laser Pointer
          h(
            "button",
            {
              className: `exc-btn ${activeTool === "laser" ? "active" : ""}`,
              onClick: () => handleToolClick("laser"),
              title: "Laser Pointer"
            },
            Icons.laser()
          ),

          // 5. Free-Draw Lasso Selection
          h(
            "button",
            {
              className: `exc-btn ${activeTool === "lasso" ? "active" : ""}`,
              onClick: () => handleToolClick("lasso"),
              title: "Free-Draw Lasso Selection (Circle full object to select)"
            },
            Icons.lasso()
          ),

          // 6. Active Extra Tool Indicator (When Highlighter, Shape, Text, Note, Bucket, or Pan is selected from Three-Dots)
          isExtraToolActive || lastExtraTool
            ? h(
                "button",
                {
                  className: `exc-btn ${
                    activeTool === "highlighter" || SHAPE_TOOLS.includes(activeTool) ? "customizable" : ""
                  } ${isExtraToolActive ? "active" : ""}`,
                  onClick: () => handleToolClick(isExtraToolActive ? activeTool : lastExtraTool),
                  title: "Active Extra Tool (Click again to customize)"
                },
                Icons[
                  (EXTRA_TOOLS_LIST.find((t) => t.id === (isExtraToolActive ? activeTool : lastExtraTool)) || {
                    icon: "highlighter"
                  }).icon
                ]()
              )
            : null,

          h("div", { className: "exc-divider" }),

          // 7. Color Slots (1st click selects color, 2nd click on active color opens palette + color wheel)
          colorSlots.map((hex, idx) =>
            h(
              "button",
              {
                key: idx,
                className: `color-btn ${activeColorIdx === idx ? "active" : ""}`,
                onClick: () => handleColorSlotClick(idx),
                title:
                  activeColorIdx === idx
                    ? "Click again to change this color slot"
                    : `Select color ${hex}`
              },
              h("span", {
                className: "color-btn-inner",
                style: { backgroundColor: hex }
              })
            )
          ),

          h("div", { className: "exc-divider" }),

          // 8. Clear All Annotations on Current Page
          h(
            "button",
            {
              className: "exc-btn",
              onClick: handleClearCurrentPageAnnotations,
              title: "Clear Page Annotations"
            },
            Icons.clearAll()
          ),

          // 9. Three Dot Menu (Highlighter, Shapes, Text, Note, Bucket, Image, Lock, Background)
          h(
            "button",
            {
              className: `exc-btn ${openPopover === "menu" || openPopover === "background" ? "active" : ""}`,
              onClick: () => setOpenPopover(openPopover === "menu" || openPopover === "background" ? null : "menu"),
              title: "More Tools"
            },
            Icons.threeDots()
          )
        ),

        // =====================================================================
        // BOTTOM-RIGHT ISLAND & 1-COLUMN LOW-RES PAGE PREVIEW DRAWER
        // Always remains visible in Fullscreen Mode!
        // =====================================================================
        h(
          "div",
          { className: "exc-island dock-right" },
          h(
            "button",
            {
              className: `exc-btn ${showPreviewDrawer ? "active" : ""}`,
              onClick: () => {
                setOpenPopover(null);
                setShowPreviewDrawer(!showPreviewDrawer);
              },
              title: "Page Previews"
            },
            Icons.pagesPreview()
          )
        ),

        showPreviewDrawer
          ? h(
              "aside",
              { className: "preview-drawer" },
              h(
                "div",
                { className: "preview-drawer-header" },
                h("span", null, `Pages (${totalPages})`),
                h(
                  "button",
                  {
                    className: "option-pill",
                    style: { flex: "none", height: "24px", padding: "0 8px", fontSize: "11px" },
                    onClick: () => handleInsertBlankPage(),
                    title: "Add New Page after current page"
                  },
                  "+ Page"
                )
              ),
              h(
                "div",
                { className: "preview-list" },
                engineRef.current.pages.map((p, idx) => {
                  const hasInk =
                    engineRef.current.pageVectors[idx] &&
                    engineRef.current.pageVectors[idx].length > 0;
                  return h(
                    "div",
                    {
                      key: idx,
                      className: `preview-card ${currentPage === idx ? "active" : ""}`,
                      onClick: () => goToPage(idx)
                    },
                    thumbnails[idx]
                      ? h("img", {
                          className: "preview-thumb",
                          src: thumbnails[idx],
                          alt: `Page ${idx + 1}`
                        })
                      : h(
                          "div",
                          {
                            className: "preview-thumb",
                            style: {
                              display: "flex",
                              alignItems: "center",
                              justifyContent: "center",
                              fontSize: "11px",
                              color: "#64748b"
                            }
                          },
                          `Page ${idx + 1}`
                        ),
                    h(
                      "div",
                      { className: "preview-meta" },
                      h("span", null, `Page ${idx + 1}`),
                      hasInk ? h("span", { className: "ink-dot", title: "Has annotations" }) : null
                    )
                  );
                })
              )
            )
          : null
      );
    }

    const root = window.ReactDOM.createRoot(document.getElementById("root"));
    root.render(window.React.createElement(App));
  </script>
</body>
</html>
