<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ExcaliNote3 — 4K Smartboard & PDF Whiteboard</title>

  <script id="lib-react" src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script id="lib-react-dom" src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script id="lib-excalidraw" src="https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js" crossorigin="anonymous"></script>
  <script id="lib-pdfjs" src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
  <script id="lib-jspdf" src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>

  <style>
    :root,
    [data-theme="dark"] {
      --bg-canvas: #121212;
      --island-bg: #232329;
      --island-border: #363640;
      --island-shadow: 0 4px 20px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
      --icon-color: #e2e8f0;
      --icon-muted: #94a3b8;
      --btn-hover: #31303b;
      --btn-active-bg: #403e6a;
      --btn-active-text: #e0dfff;
      --accent: #6965db;
      --popover-bg: #232329;
    }

    [data-theme="light"] {
      --bg-canvas: #f8f9fa;
      --island-bg: #ffffff;
      --island-border: #e2e8f0;
      --island-shadow: 0 4px 16px rgba(15, 23, 42, 0.1), 0 0 0 1px rgba(15, 23, 42, 0.06);
      --icon-color: #1e293b;
      --icon-muted: #64748b;
      --btn-hover: #f1f5f9;
      --btn-active-bg: #e0dfff;
      --btn-active-text: #403e6a;
      --accent: #6965db;
      --popover-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html,
    body,
    #root {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    .app-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-canvas);
    }

    .canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Prevent Excalidraw's dark theme from inverting canvas PDF/background/ink colors */
    .excalidraw.theme--dark .excalidraw__canvas,
    .excalidraw.theme--dark canvas {
      filter: none !important;
    }

    /* Completely remove Excalidraw's native upper bar, side property popup, mobile floating bar, and footer */
    .excalidraw .App-menu_top,
    .excalidraw .App-menu_bottom,
    .excalidraw .App-bottom-bar,
    .excalidraw .App-toolbar,
    .excalidraw .App-toolbar-container,
    .excalidraw .mobile-misc-tools-container,
    .excalidraw .sidebar-trigger,
    .excalidraw .default-sidebar-trigger,
    .excalidraw .help-icon,
    .excalidraw .HintViewer,
    .excalidraw .layer-ui__wrapper__top-right,
    .excalidraw .layer-ui__wrapper__footer,
    .excalidraw .zen-mode-transition {
      display: none !important;
    }

    /* Excalidraw-Style Island Containers */
    .exc-island {
      background: var(--island-bg);
      border-radius: 10px;
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: var(--island-shadow);
      z-index: 40;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    /* Top Navbar Island (Vanishes in Fullscreen Mode) */
    .top-navbar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 24px);
      overflow-x: auto;
      z-index: 45;
      padding: 4px 8px;
      gap: 6px;
    }

    .nav-pill-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--icon-color);
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .nav-pill-btn:hover:not(:disabled) {
      background: var(--btn-hover);
    }

    .nav-pill-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .nav-pill-btn.active {
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
    }

    .nav-pill-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Free-Draw Lasso SVG Overlay */
    .lasso-svg-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 35;
    }

    /* Background Preset Grid inside Background Popover */
    .bg-preset-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-height: 210px;
      overflow-y: auto;
      padding-right: 2px;
      margin-bottom: 8px;
    }

    .bg-preset-card {
      height: 44px;
      border-radius: 7px;
      border: 2px solid var(--island-border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 3px;
      font-size: 9px;
      font-weight: 600;
      position: relative;
      overflow: hidden;
      transition: transform 0.1s ease, border-color 0.12s ease;
    }

    .bg-preset-card:hover {
      transform: translateY(-1px);
    }

    .bg-preset-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(105, 101, 219, 0.35);
    }

    .bg-preset-label {
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 9px;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Center Bottom Annotation Bar */
    .dock-center {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Floating Selection Layer Action Bar (Appears right above/beside dock when objects are selected) */
    .selection-layer-bar {
      --pop-x: -50%;
      position: fixed;
      bottom: 62px;
      left: 50%;
      transform: translate(var(--pop-x), 0);
      z-index: 50;
      animation: popUp 0.12s ease-out;
    }

    /* Bottom-Left Page Navigation Island */
    .dock-left {
      position: fixed;
      bottom: 14px;
      left: 14px;
    }

    /* Bottom-Right Preview Toggle Island */
    .dock-right {
      position: fixed;
      bottom: 14px;
      right: 14px;
    }

    /* Monochromatic Excalidraw-Style Icon Button */
    .exc-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--icon-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease;
      flex-shrink: 0;
    }

    .exc-btn:hover:not(:disabled) {
      background: var(--btn-hover);
    }

    .exc-btn:active:not(:disabled) {
      transform: scale(0.95);
    }

    .exc-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .exc-btn.active {
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
    }

    /* Small indicator dot showing a second click opens customization */
    .exc-btn.active.customizable::after {
      content: "";
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.75;
    }

    .exc-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .exc-divider {
      width: 1px;
      height: 22px;
      background: var(--island-border);
      margin: 0 2px;
      flex-shrink: 0;
    }

    /* Color Swatch Button inside the Excalidraw Bar */
    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: none;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      padding: 0;
      margin: 0 1px;
    }

    .color-btn-inner {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    [data-theme="light"] .color-btn-inner {
      border-color: rgba(0, 0, 0, 0.22);
    }

    .color-btn.active {
      background: var(--btn-active-bg);
    }

    .color-btn.active .color-btn-inner {
      transform: scale(1.12);
      box-shadow: 0 0 0 2px var(--island-bg), 0 0 0 3.5px var(--accent);
    }

    /* Page Counter in Bottom-Left Island */
    .page-counter {
      font-size: 12px;
      font-weight: 600;
      color: var(--icon-color);
      padding: 0 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-variant-numeric: tabular-nums;
    }

    .page-num-input {
      width: 34px;
      height: 26px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--icon-color);
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    .page-num-input:hover,
    .page-num-input:focus {
      border-color: var(--island-border);
      background: var(--btn-hover);
    }

    /* Compact Popover Panels (Icon-Only Online Class Layout) */
    .exc-popover {
      --pop-x: -50%;
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translate(var(--pop-x), 0);
      background: var(--popover-bg);
      border-radius: 11px;
      padding: 10px;
      box-shadow: var(--island-shadow);
      z-index: 60;
      min-width: 210px;
      color: var(--icon-color);
      animation: popUp 0.12s ease-out;
      border: 1px solid var(--island-border);
    }

    @keyframes popUp {
      from {
        opacity: 0;
        transform: translate(var(--pop-x, 0px), 6px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translate(var(--pop-x, 0px), 0px) scale(1);
      }
    }

    .popover-section {
      margin-bottom: 8px;
    }

    .popover-section:last-child {
      margin-bottom: 0;
    }

    .popover-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--icon-muted);
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 0.02em;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .option-pill {
      flex: 1;
      height: 32px;
      min-width: 32px;
      border-radius: 7px;
      border: 1px solid var(--island-border);
      background: transparent;
      color: var(--icon-color);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      position: relative;
      transition: all 0.12s ease;
      padding: 0 6px;
    }

    .option-pill:hover {
      background: var(--btn-hover);
    }

    .option-pill.active {
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
      border-color: var(--accent);
    }

    .option-pill.active.customizable-slot::after {
      content: "";
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.8;
    }

    .option-pill svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Excalidraw-Style Touch Slider for Opacity & Custom Width */
    .exc-slider-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 95px;
    }

    .exc-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: var(--island-border);
      outline: none;
      cursor: pointer;
    }

    .exc-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .exc-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .width-customizer-box {
      margin-top: 6px;
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(105, 101, 219, 0.1);
      border: 1px dashed var(--accent);
      animation: popUp 0.1s ease-out;
    }

    /* Compact 2-Row Horizontal Scrolling Icon Strip inside Three-Dots */
    .tools-scroll-grid {
      display: grid;
      grid-template-rows: repeat(2, 36px);
      grid-auto-flow: column;
      grid-auto-columns: 36px;
      gap: 5px;
      max-width: 196px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .tools-scroll-grid::-webkit-scrollbar {
      height: 4px;
    }

    .tools-scroll-grid::-webkit-scrollbar-thumb {
      background: var(--island-border);
      border-radius: 99px;
    }

    .tool-grid-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--island-border);
      background: transparent;
      color: var(--icon-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s ease;
      padding: 0;
    }

    .tool-grid-btn:hover {
      background: var(--btn-hover);
    }

    .tool-grid-btn.active {
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
      border-color: var(--accent);
    }

    .tool-grid-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Color Grid inside Color Customization Popover */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .palette-swatch {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: transform 0.1s ease;
      justify-self: center;
    }

    [data-theme="light"] .palette-swatch {
      border-color: rgba(0, 0, 0, 0.15);
    }

    .palette-swatch:hover {
      transform: scale(1.12);
    }

    .palette-swatch.selected {
      box-shadow: 0 0 0 2px var(--popover-bg), 0 0 0 4px var(--accent);
    }

    .color-wheel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--island-border);
    }

    .color-wheel-input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 32px;
      border: 1px solid var(--island-border);
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      padding: 2px;
    }

    .color-wheel-input::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-wheel-input::-webkit-color-swatch {
      border: none;
      border-radius: 5px;
    }

    /* Three-Dot Menu List */
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 245px;
    }

    .menu-item {
      width: 100%;
      padding: 8px 10px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--icon-color);
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: background 0.12s ease;
    }

    .menu-item:hover:not(:disabled) {
      background: var(--btn-hover);
    }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .menu-item svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    .menu-divider {
      height: 1px;
      background: var(--island-border);
      margin: 4px 0;
    }

    .menu-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 99px;
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
      font-weight: 600;
    }

    /* Single-Column Low-Res Page Preview Drawer (Bottom-Right) */
    .preview-drawer {
      position: fixed;
      bottom: 66px;
      right: 16px;
      width: 210px;
      max-height: min(68vh, 520px);
      background: var(--popover-bg);
      border: 1px solid var(--island-border);
      border-radius: 12px;
      box-shadow: var(--island-shadow);
      z-index: 55;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: popUp 0.14s ease-out;
    }

    .preview-drawer-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--island-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--icon-color);
    }

    .preview-list {
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .preview-card {
      border-radius: 8px;
      border: 2px solid var(--island-border);
      background: rgba(0, 0, 0, 0.15);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.12s ease, transform 0.1s ease;
    }

    .preview-card:hover {
      transform: translateY(-1px);
    }

    .preview-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(105, 101, 219, 0.28);
    }

    .preview-thumb {
      width: 100%;
      height: 104px;
      object-fit: contain;
      background: #ffffff;
      display: block;
    }

    .preview-meta {
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--icon-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ink-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    /* Status Pill Toast */
    .status-toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      background: var(--popover-bg);
      color: var(--icon-color);
      border: 1px solid var(--island-border);
      box-shadow: var(--island-shadow);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 80;
    }

    .status-spinner {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid var(--icon-muted);
      border-top-color: var(--accent);
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      .top-navbar {
        top: 8px;
        padding: 4px;
      }
      .nav-pill-btn span.nav-text {
        display: none;
      }
      .dock-center {
        max-width: calc(100vw - 16px);
        overflow-x: auto;
      }
      .dock-left {
        bottom: 60px;
        left: 10px;
      }
      .dock-right {
        bottom: 60px;
        right: 10px;
      }
      .selection-layer-bar {
        bottom: 106px;
      }
      .preview-drawer {
        bottom: 106px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // =========================================================================
    // 1. CONFIGURE PDF.JS WORKER (Supports both Online CDN and Inline Offline)
    // =========================================================================
    (function setupPdfWorker() {
      if (!window.pdfjsLib) return;
      const inlineWorkerEl = document.getElementById("inline-pdf-worker");
      if (inlineWorkerEl && inlineWorkerEl.textContent.trim().length > 50) {
        const blob = new Blob([inlineWorkerEl.textContent], { type: "application/javascript" });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
      } else {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }
    })();

    // =========================================================================
    // 2. 4K RESOLUTION PDF & WHITEBOARD ENGINE (Light & Dark Paired Templates)
    // =========================================================================
    const TARGET_4K_DIMENSION = 3840; // True 4K longest edge resolution
    const NATIVE_SCENE_DIMENSION = 1280; // Native Excalidraw 1:1 scene scale for authentic real-time pen smoothing

    // Helper to convert between Light and Dark equivalent background IDs
    function getOppositeThemeBgId(bgStyle, targetTheme) {
      if (!bgStyle || bgStyle === "custom") return bgStyle;
      if (bgStyle === "white") bgStyle = "light-plain";
      if (bgStyle === "black") bgStyle = "dark-plain";
      if (targetTheme === "dark" && bgStyle.startsWith("light-")) {
        return "dark-" + bgStyle.slice(6);
      }
      if (targetTheme === "light" && bgStyle.startsWith("dark-")) {
        return "light-" + bgStyle.slice(5);
      }
      return bgStyle;
    }

    class PageEngine4K {
      constructor() {
        this.pdfDoc = null;
        this.defaultBg = {
          bgStyle: "dark-plain",
          customBgDataUrl: null
        };
        // Virtual page descriptors (starts with dark-plain since initial UI is dark mode)
        this.pages = [
          { type: "blank", bgStyle: "dark-plain", customBgDataUrl: null, width: 3840, height: 2160 }
        ];
        // Lightweight vector stroke store per page index
        this.pageVectors = {};
        // Optional full-PDF pre-rasterized 4K cache (used when importMode === 'all')
        this.preRasterizedCache = {};
        // Low-res thumbnail cache (1-column preview drawer, ~5-10KB each)
        this.thumbnailCache = {};
      }

      clearCaches() {
        this.preRasterizedCache = {};
        this.thumbnailCache = {};
      }

      setDefaultBackground(bgStyle, customBgDataUrl = null) {
        this.defaultBg = {
          bgStyle,
          customBgDataUrl: customBgDataUrl || this.defaultBg.customBgDataUrl
        };
      }

      applyBackgroundToPage(pageIndex, bgStyle, customBgDataUrl = null) {
        const desc = this.pages[pageIndex];
        if (!desc) return;
        desc.type = "blank";
        desc.bgStyle = bgStyle;
        if (customBgDataUrl) {
          desc.customBgDataUrl = customBgDataUrl;
        } else if (bgStyle === "custom") {
          desc.customBgDataUrl = this.defaultBg.customBgDataUrl;
        }
        delete this.preRasterizedCache[pageIndex];
        delete this.thumbnailCache[pageIndex];
      }

      async loadPdfBuffer(arrayBuffer) {
        if (this.pdfDoc) {
          try { await this.pdfDoc.destroy(); } catch (e) {}
        }
        this.clearCaches();
        const loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
        this.pdfDoc = await loadingTask.promise;

        const newPages = [];
        for (let i = 1; i <= this.pdfDoc.numPages; i++) {
          newPages.push({
            type: "pdf",
            pdfPageNum: i,
            width: 3840,
            height: 2160
          });
        }
        this.pages = newPages;
        this.pageVectors = {};
        return this.pages.length;
      }

      async drawBlankOrCustomBackground(ctx, canvas, descriptor) {
        let style = descriptor.bgStyle || "dark-plain";
        if (style === "white") style = "light-plain";
        if (style === "black") style = "dark-plain";

        const customUrl = descriptor.customBgDataUrl || this.defaultBg.customBgDataUrl;

        if (style === "custom" && customUrl) {
          await new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
              const maxDim = Math.max(img.width || 1920, img.height || 1080);
              const scale = TARGET_4K_DIMENSION / maxDim;
              canvas.width = Math.round((img.width || 1920) * scale);
              canvas.height = Math.round((img.height || 1080) * scale);
              ctx.fillStyle = "#ffffff";
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              descriptor.width = canvas.width;
              descriptor.height = canvas.height;
              resolve();
            };
            img.onerror = () => {
              canvas.width = 3840;
              canvas.height = 2160;
              ctx.fillStyle = "#121214";
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              resolve();
            };
            img.src = customUrl;
          });
          return;
        }

        canvas.width = descriptor.width || 3840;
        canvas.height = descriptor.height || 2160;
        const w = canvas.width;
        const h = canvas.height;

        const isDark = style.startsWith("dark-");
        const pattern = style.replace(/^(light|dark)-/, "");

        // 1. Base Fill Color
        if (style === "dark-alt") {
          ctx.fillStyle = "#0f291e"; // Green Chalkboard
        } else if (style === "light-alt") {
          ctx.fillStyle = "#fdf8ed"; // Warm Cream Paper
        } else if (isDark) {
          ctx.fillStyle = "#141417"; // Deep Blackboard
        } else {
          ctx.fillStyle = "#ffffff"; // Crisp Whiteboard
        }
        ctx.fillRect(0, 0, w, h);

        const linePrimary = isDark ? "rgba(255, 255, 255, 0.12)" : "rgba(15, 23, 42, 0.11)";
        const lineSecondary = isDark ? "rgba(255, 255, 255, 0.05)" : "rgba(15, 23, 42, 0.05)";
        const ruleBlue = isDark ? "rgba(56, 189, 248, 0.24)" : "rgba(59, 130, 246, 0.24)";
        const marginRed = isDark ? "rgba(248, 113, 113, 0.4)" : "rgba(239, 68, 68, 0.36)";
        const dotColor = isDark ? "rgba(255, 255, 255, 0.24)" : "rgba(15, 23, 42, 0.24)";
        const accentAxis = isDark ? "rgba(148, 163, 184, 0.55)" : "rgba(71, 85, 105, 0.55)";

        // 2. Pattern Overlay
        if (pattern === "grid") {
          const step = 96;
          ctx.strokeStyle = linePrimary;
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let x = step; x < w; x += step) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
          }
          for (let y = step; y < h; y += step) {
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
          }
          ctx.stroke();
        } else if (pattern === "dots") {
          const step = 96;
          ctx.fillStyle = dotColor;
          for (let x = step; x < w; x += step) {
            for (let y = step; y < h; y += step) {
              ctx.beginPath();
              ctx.arc(x, y, 3.8, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        } else if (pattern === "ruled" || pattern === "wideruled") {
          const step = pattern === "wideruled" ? 136 : 92;
          ctx.strokeStyle = ruleBlue;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          for (let y = 180; y < h; y += step) {
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
          }
          ctx.stroke();
          ctx.strokeStyle = marginRed;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(320, 0);
          ctx.lineTo(320, h);
          ctx.stroke();
        } else if (pattern === "cornell") {
          const step = 92;
          const cueX = 960;
          const headerY = 220;
          const summaryY = h - 420;
          ctx.strokeStyle = ruleBlue;
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          for (let y = headerY + step; y < summaryY; y += step) {
            ctx.moveTo(cueX, y);
            ctx.lineTo(w, y);
          }
          ctx.stroke();
          ctx.strokeStyle = marginRed;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(0, headerY);
          ctx.lineTo(w, headerY);
          ctx.moveTo(cueX, headerY);
          ctx.lineTo(cueX, summaryY);
          ctx.moveTo(0, summaryY);
          ctx.lineTo(w, summaryY);
          ctx.stroke();
        } else if (pattern === "isometric") {
          const spacing = 110;
          const rowH = Math.round(spacing * Math.sin(Math.PI / 3));
          ctx.fillStyle = dotColor;
          let row = 0;
          for (let y = rowH; y < h; y += rowH) {
            const offsetX = (row % 2) * (spacing / 2);
            for (let x = spacing + offsetX; x < w - spacing / 2; x += spacing) {
              ctx.beginPath();
              ctx.arc(x, y, 4, 0, Math.PI * 2);
              ctx.fill();
            }
            row++;
          }
        } else if (pattern === "graph") {
          const minor = 32;
          const major = minor * 5;
          ctx.strokeStyle = lineSecondary;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          for (let x = minor; x < w; x += minor) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
          }
          for (let y = minor; y < h; y += minor) {
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
          }
          ctx.stroke();

          ctx.strokeStyle = linePrimary;
          ctx.lineWidth = 3;
          ctx.beginPath();
          for (let x = major; x < w; x += major) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
          }
          for (let y = major; y < h; y += major) {
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
          }
          ctx.stroke();
        } else if (pattern === "coord") {
          const step = 96;
          const cx = Math.floor(w / 2);
          const cy = Math.floor(h / 2);
          ctx.strokeStyle = linePrimary;
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let x = cx % step; x < w; x += step) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
          }
          for (let y = cy % step; y < h; y += step) {
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
          }
          ctx.stroke();

          ctx.strokeStyle = accentAxis;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(0, cy);
          ctx.lineTo(w, cy);
          ctx.moveTo(cx, 0);
          ctx.lineTo(cx, h);
          ctx.stroke();
        } else if (pattern === "music") {
          const lineGap = 24;
          const staffGap = 220;
          ctx.strokeStyle = linePrimary;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          for (let base = 200; base < h - 180; base += staffGap) {
            for (let l = 0; l < 5; l++) {
              const y = base + l * lineGap;
              ctx.moveTo(180, y);
              ctx.lineTo(w - 180, y);
            }
          }
          ctx.stroke();
        }
      }

      /**
       * Renders a single page at crisp 4K resolution (3840px longest edge).
       */
      async renderPage4K(pageIndex, storeInCache = false) {
        if (this.preRasterizedCache[pageIndex]) {
          return this.preRasterizedCache[pageIndex];
        }

        const descriptor = this.pages[pageIndex];
        if (!descriptor) throw new Error("Invalid page index");

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d", { alpha: false });

        if (descriptor.type === "pdf" && this.pdfDoc) {
          const page = await this.pdfDoc.getPage(descriptor.pdfPageNum);
          const baseViewport = page.getViewport({ scale: 1.0 });
          const maxBaseDim = Math.max(baseViewport.width, baseViewport.height) || 1000;
          const scale4K = Math.min(Math.max(TARGET_4K_DIMENSION / maxBaseDim, 1.5), 5.0);
          const viewport = page.getViewport({ scale: scale4K });

          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);

          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          await page.render({ canvasContext: ctx, viewport }).promise;
          page.cleanup();

          descriptor.width = canvas.width;
          descriptor.height = canvas.height;
        } else {
          await this.drawBlankOrCustomBackground(ctx, canvas, descriptor);
        }

        // Also generate a lightweight low-res thumbnail if not already cached
        if (!this.thumbnailCache[pageIndex]) {
          const thumbCanvas = document.createElement("canvas");
          const thumbScale = 220 / Math.max(canvas.width, canvas.height);
          thumbCanvas.width = Math.max(1, Math.floor(canvas.width * thumbScale));
          thumbCanvas.height = Math.max(1, Math.floor(canvas.height * thumbScale));
          const tCtx = thumbCanvas.getContext("2d", { alpha: false });
          tCtx.drawImage(canvas, 0, 0, thumbCanvas.width, thumbCanvas.height);
          this.thumbnailCache[pageIndex] = thumbCanvas.toDataURL("image/jpeg", 0.6);
          thumbCanvas.width = 0;
          thumbCanvas.height = 0;
        }

        let dataURL = canvas.toDataURL("image/webp", 0.88);
        if (!dataURL.startsWith("data:image/webp")) {
          dataURL = canvas.toDataURL("image/jpeg", 0.90);
        }

        // Map 4K pixel dimensions to even-integer scene dimensions matched to the screen viewport
        // so Fit Mode runs at a clean 1.0 zoom without fractional sub-pixel offscreen-canvas jitter.
        const vw = window.innerWidth || 1280;
        const vh = window.innerHeight || 720;
        const fitScale = Math.min(vw / canvas.width, vh / canvas.height);
        const sceneWidth = Math.max(2, Math.round((canvas.width * fitScale) / 2) * 2);
        const sceneHeight = Math.max(2, Math.round((canvas.height * fitScale) / 2) * 2);

        const result = {
          dataURL,
          width: sceneWidth,
          height: sceneHeight,
          pixelWidth: canvas.width,
          pixelHeight: canvas.height,
          mimeType: dataURL.startsWith("data:image/webp") ? "image/webp" : "image/jpeg"
        };

        // Immediately release GPU canvas memory
        canvas.width = 0;
        canvas.height = 0;

        if (storeInCache) {
          this.preRasterizedCache[pageIndex] = result;
        }

        return result;
      }

      /**
       * Renders a tiny low-res thumbnail (~220px) for the bottom-right preview column.
       */
      async renderLowResThumbnail(pageIndex) {
        if (this.thumbnailCache[pageIndex]) {
          return this.thumbnailCache[pageIndex];
        }
        const descriptor = this.pages[pageIndex];
        if (!descriptor) return "";

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d", { alpha: false });

        if (descriptor.type === "pdf" && this.pdfDoc) {
          const page = await this.pdfDoc.getPage(descriptor.pdfPageNum);
          const baseVp = page.getViewport({ scale: 1.0 });
          const scale = 220 / Math.max(baseVp.width, baseVp.height);
          const vp = page.getViewport({ scale });
          canvas.width = Math.max(1, Math.floor(vp.width));
          canvas.height = Math.max(1, Math.floor(vp.height));
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          await page.render({ canvasContext: ctx, viewport: vp }).promise;
          page.cleanup();
        } else {
          canvas.width = 220;
          canvas.height = 124;
          const st = descriptor.bgStyle || "dark-plain";
          const isDark = st.startsWith("dark-");
          ctx.fillStyle =
            st === "dark-alt" ? "#0f291e" : st === "light-alt" ? "#fdf8ed" : isDark ? "#141417" : "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        const thumbUrl = canvas.toDataURL("image/jpeg", 0.6);
        canvas.width = 0;
        canvas.height = 0;
        this.thumbnailCache[pageIndex] = thumbUrl;
        return thumbUrl;
      }

      insertBlankPageAfter(currentIndex, overrideStyle = null) {
        const refPage = this.pages[currentIndex] || { width: 3840, height: 2160 };
        const newIndex = currentIndex + 1;

        const shiftMap = (mapObj) => {
          const updated = {};
          Object.keys(mapObj).forEach((k) => {
            const idx = parseInt(k, 10);
            updated[idx <= currentIndex ? idx : idx + 1] = mapObj[idx];
          });
          return updated;
        };

        this.pageVectors = shiftMap(this.pageVectors);
        this.preRasterizedCache = shiftMap(this.preRasterizedCache);
        this.thumbnailCache = shiftMap(this.thumbnailCache);

        const chosenStyle = overrideStyle || this.defaultBg.bgStyle || "dark-plain";

        this.pages.splice(newIndex, 0, {
          type: "blank",
          bgStyle: chosenStyle,
          customBgDataUrl: this.defaultBg.customBgDataUrl,
          width: refPage.width || 3840,
          height: refPage.height || 2160
        });

        return newIndex;
      }
    }

    // =========================================================================
    // 3. LOCKED BACKGROUND ELEMENT FACTORY
    // =========================================================================
    function createLockedPageElement(pageIndex, fileId, width, height) {
      return {
        id: `__page_bg_${pageIndex}__`,
        type: "image",
        x: 0,
        y: 0,
        width,
        height,
        angle: 0,
        strokeColor: "transparent",
        backgroundColor: "transparent",
        fillStyle: "solid",
        strokeWidth: 1,
        strokeStyle: "solid",
        roughness: 0,
        opacity: 100,
        groupIds: [],
        frameId: null,
        roundness: null,
        seed: 1001 + pageIndex,
        version: 1,
        versionNonce: 2002 + pageIndex,
        isDeleted: false,
        boundElements: null,
        updated: Date.now(),
        link: null,
        locked: true,
        fileId,
        scale: [1, 1],
        status: "saved"
      };
    }

    // =========================================================================
    // 4. AUTO SHAPE RECOGNIZER (Converts Freehand Strokes to Clean Shapes)
    // =========================================================================
    function recognizeAndCreateGeometricElement(freedrawEl, shapeCfg) {
      const pts = freedrawEl.points;
      if (!Array.isArray(pts) || pts.length < 5) return null;

      const start = pts[0];
      const end = pts[pts.length - 1];
      const directDist = Math.hypot(end[0] - start[0], end[1] - start[1]);

      let pathLength = 0;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (let i = 0; i < pts.length; i++) {
        const [px, py] = pts[i];
        if (px < minX) minX = px;
        if (py < minY) minY = py;
        if (px > maxX) maxX = px;
        if (py > maxY) maxY = py;
        if (i > 0) {
          pathLength += Math.hypot(px - pts[i - 1][0], py - pts[i - 1][1]);
        }
      }

      const boxW = maxX - minX;
      const boxH = maxY - minY;
      const diag = Math.hypot(boxW, boxH);
      if (diag < 24) return null;

      const baseProps = {
        x: freedrawEl.x + minX,
        y: freedrawEl.y + minY,
        width: Math.max(12, boxW),
        height: Math.max(12, boxH),
        angle: 0,
        strokeColor: freedrawEl.strokeColor,
        backgroundColor:
          shapeCfg && shapeCfg.fillStyle !== "transparent"
            ? freedrawEl.strokeColor + "33"
            : "transparent",
        fillStyle:
          shapeCfg && shapeCfg.fillStyle !== "transparent" ? shapeCfg.fillStyle : "solid",
        strokeWidth: (shapeCfg && shapeCfg.strokeWidth) || freedrawEl.strokeWidth || 3.5,
        strokeStyle: (shapeCfg && shapeCfg.strokeStyle) || "solid",
        roughness: shapeCfg && typeof shapeCfg.roughness === "number" ? shapeCfg.roughness : 0,
        opacity: (shapeCfg && shapeCfg.opacity) || freedrawEl.opacity || 100,
        groupIds: [],
        frameId: null,
        roundness: { type: 3 },
        seed: Math.floor(Math.random() * 100000),
        version: 2,
        versionNonce: Math.floor(Math.random() * 100000000),
        isDeleted: false,
        boundElements: null,
        updated: Date.now(),
        link: null,
        locked: false
      };

      // 1. Check if straight line (path length very close to direct distance)
      if (directDist / (pathLength + 0.001) > 0.86) {
        return {
          ...baseProps,
          id: "shape_line_" + Date.now(),
          type: "line",
          x: freedrawEl.x + start[0],
          y: freedrawEl.y + start[1],
          width: Math.abs(end[0] - start[0]),
          height: Math.abs(end[1] - start[1]),
          points: [
            [0, 0],
            [end[0] - start[0], end[1] - start[1]]
          ],
          lastCommittedPoint: null,
          startBinding: null,
          endBinding: null,
          startArrowhead: null,
          endArrowhead: null
        };
      }

      // 2. Check if closed loop (start and end points close relative to bounding diagonal)
      const isClosed = directDist < diag * 0.42;
      if (!isClosed) return null;

      // Measure radial variance from center to distinguish circle/ellipse vs rectangle
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const rx = Math.max(10, boxW / 2);
      const ry = Math.max(10, boxH / 2);

      let normErrSum = 0;
      for (let i = 0; i < pts.length; i++) {
        const dx = (pts[i][0] - cx) / rx;
        const dy = (pts[i][1] - cy) / ry;
        const r = Math.hypot(dx, dy);
        normErrSum += Math.abs(r - 1);
      }
      const avgEllipseErr = normErrSum / pts.length;

      if (avgEllipseErr < 0.22) {
        return {
          ...baseProps,
          id: "shape_ellipse_" + Date.now(),
          type: "ellipse"
        };
      }

      return {
        ...baseProps,
        id: "shape_rect_" + Date.now(),
        type: "rectangle"
      };
    }

    // =========================================================================
    // 5. MONOCHROMATIC EXCALIDRAW-STYLE SVG ICONS & STRICT LASSO GEOMETRY
    // =========================================================================
    /**
     * Combined Non-Zero Winding + Even-Odd Point-in-Polygon check.
     * Handles both standard loops and hand-drawn lassos whose start/end tails cross over each other.
     */
    function isPointInPolygon(px, py, polygon) {
      let evenOddInside = false;
      let windingNumber = 0;

      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i][0], yi = polygon[i][1];
        const xj = polygon[j][0], yj = polygon[j][1];

        // Even-Odd Ray-Casting
        const intersect =
          yi > py !== yj > py &&
          px < ((xj - xi) * (py - yi)) / (yj - yi + 1e-7) + xi;
        if (intersect) evenOddInside = !evenOddInside;

        // Non-Zero Winding Number (prevents self-overlapping tail loops from canceling out)
        if (yj <= py) {
          if (yi > py && (xi - xj) * (py - yj) - (px - xj) * (yi - yj) > 0) {
            windingNumber++;
          }
        } else {
          if (yi <= py && (xi - xj) * (py - yj) - (px - xj) * (yi - yj) < 0) {
            windingNumber--;
          }
        }
      }
      return windingNumber !== 0 || evenOddInside;
    }

    function rotatePoint(px, py, cx, cy, angle) {
      if (!angle) return [px, py];
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      const dx = px - cx;
      const dy = py - cy;
      return [cx + dx * cos - dy * sin, cy + dx * sin + dy * cos];
    }

    /**
     * Compute true visual bounding box of an element in scene coordinates (handles negative point offsets)
     */
    function getElementSceneBounds(el) {
      if (Array.isArray(el.points) && el.points.length > 0) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (let i = 0; i < el.points.length; i++) {
          const px = el.x + el.points[i][0];
          const py = el.y + el.points[i][1];
          if (px < minX) minX = px;
          if (py < minY) minY = py;
          if (px > maxX) maxX = px;
          if (py > maxY) maxY = py;
        }
        return { minX, minY, maxX, maxY };
      }
      const x1 = el.x || 0;
      const y1 = el.y || 0;
      const x2 = x1 + (el.width || 0);
      const y2 = y1 + (el.height || 0);
      return {
        minX: Math.min(x1, x2),
        minY: Math.min(y1, y2),
        maxX: Math.max(x1, x2),
        maxY: Math.max(y1, y2)
      };
    }

    /**
     * Generates accurate geometric sample points along the TRUE visual shape of an element
     * (e.g. actual circle perimeter for ellipses instead of empty square bounding-box corners,
     * interpolated segments for lines/triangles, and stroke points for freedraw).
     */
    function getElementTrueSamplePoints(el) {
      const bounds = getElementSceneBounds(el);
      const cx = (bounds.minX + bounds.maxX) / 2;
      const cy = (bounds.minY + bounds.maxY) / 2;
      const angle = el.angle || 0;
      const samples = [];

      // 1. Point-based elements: freedraw, line, arrow, triangle
      if (Array.isArray(el.points) && el.points.length > 0) {
        if (el.type === "freedraw" || el.points.length > 12) {
          const step = Math.max(1, Math.floor(el.points.length / 28));
          for (let i = 0; i < el.points.length; i += step) {
            samples.push(
              rotatePoint(el.x + el.points[i][0], el.y + el.points[i][1], cx, cy, angle)
            );
          }
          const last = el.points[el.points.length - 1];

            const p2 = el.points[i + 1];
            const steps = 6;
            for (let s = 0; s <= steps; s++) {
              const t = s / steps;
              const px = el.x + p1[0] + (p2[0] - p1[0]) * t;
              const py = el.y + p1[1] + (p2[1] - p1[1]) * t;
              samples.push(rotatePoint(px, py, cx, cy, angle));
            }
          }
        }
        return { samples, center: [cx, cy] };
      }

      if (el.type === "ellipse") {
        const rx = Math.max(2, (bounds.maxX - bounds.minX) / 2);
        const ry = Math.max(2, (bounds.maxY - bounds.minY) / 2);
        const numPts = 16;
        for (let i = 0; i < numPts; i++) {
          const theta = (i / numPts) * Math.PI * 2;
          const px = cx + rx * Math.cos(theta);
          const py = cy + ry * Math.sin(theta);
          samples.push(rotatePoint(px, py, cx, cy, angle));
        }
        samples.push([cx, cy]);
        return { samples, center: [cx, cy] };
      }

      if (el.type === "diamond") {
        const verts = [
          [cx, bounds.minY],
          [bounds.maxX, cy],
          [cx, bounds.maxY],
          [bounds.minX, cy]
        ];
        for (let i = 0; i < 4; i++) {

          const v2 = verts[(i + 1) % 4];
          for (let s = 0; s < 4; s++) {
            const t = s / 4;
            samples.push(
              rotatePoint(v1[0] + (v2[0] - v1[0]) * t, v1[1] + (v2[1] - v1[1]) * t, cx, cy, angle)
            );
          }
        }
        samples.push([cx, cy]);
        return { samples, center: [cx, cy] };
      }

      const verts = [
        [bounds.minX, bounds.minY],
        [bounds.maxX, bounds.minY],
        [bounds.maxX, bounds.maxY],
        [bounds.minX, bounds.maxY]
      ];

        const v2 = verts[(i + 1) % 4];
        for (let s = 0; s < 4; s++) {

          samples.push(

      samples.push([cx, cy]);

      { id: "dark-coord",     theme: "dark",  label: "Dark XY",     bg: "linear-gradient(0deg,transparent 47%,#64748b 47%,#64748b 53%,transparent 53%),linear-gradient(90deg,#141417 47%,#64748b 47%,#64748b 53%,#141417 53%)" },
      { id: "dark-music",     theme: "dark",  label: "Dark Music",  bg: "repeating-linear-gradient(0deg,#3f3f46,#3f3f46 1px,#141417 1px,#141417 4px)" },

      // Light Versions (Exact Light Equivalents)
      { id: "light-plain",     theme: "light", label: "White",       bg: "#ffffff" },
