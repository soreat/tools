<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Forge Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/xml-fold.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-html.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f1115; color: #e2e8f0; overflow: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .bg-checker-dark {
            background-image: linear-gradient(45deg, #16181d 25%, transparent 25%), linear-gradient(-45deg, #16181d 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #16181d 75%), linear-gradient(-45deg, transparent 75%, #16181d 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .bg-checker-light {
            background-color: #f1f5f9;
            background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e2e8f0 75%), linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .svg-container svg { display: block; width: 100%; height: 100%; overflow: visible; }

        .layer-card { transition: border-color 0.2s, box-shadow 0.2s; }
        .layer-card.highlight { border-color: #6366f1; box-shadow: 0 0 0 1px #6366f1; }
        
        input[type="range"] {
            -webkit-appearance: none; width: 100%; min-width: 0; height: 4px; background: #334155; border-radius: 2px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #818cf8; cursor: pointer; transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        /* Bounding Box Selector */
        #selection-box {
            position: absolute; border: 2px dashed #818cf8; background-color: rgba(129, 140, 248, 0.1);
            pointer-events: none; z-index: 10; opacity: 0; transition: opacity 0.15s ease;
            box-shadow: 0 0 10px rgba(129, 140, 248, 0.3); border-radius: 2px;
        }
        #selection-box.active { opacity: 1; }

        /* Marquee Selector */
        #marquee {
            position: absolute; border: 1px solid #38bdf8; background-color: rgba(56, 189, 248, 0.2);
            pointer-events: none; z-index: 20;
        }

        /* Split Grid Lines */
        .split-line { transition: stroke 0.2s; }
        .split-line:hover { stroke: #22d3ee !important; filter: drop-shadow(0 0 4px #22d3ee); }
        
        .CodeMirror { height: 100%; font-family: 'Fira Code', monospace; font-size: 14px; border-radius: 0.5rem; }
    </style>
</head>
<body class="h-screen flex flex-col w-full text-sm">

    <div class="flex-1 flex overflow-hidden min-h-0">
        <!-- LEFT PANEL: Controls -->
        <aside class="w-80 bg-[#16181d] border-r border-gray-800 flex flex-col h-full shrink-0 z-30 shadow-xl relative min-h-0">
            <!-- Header -->
            <div class="p-4 border-b border-gray-800 flex items-center justify-between shrink-0">
                <h1 class="font-bold text-lg flex items-center gap-2 text-white"><i class="ph-fill ph-vector-two text-indigo-500"></i> SVG Forge</h1>
            </div>

            <!-- Toolbar (Quick Paste & Actions) -->
            <div class="p-3 border-b border-gray-800 flex flex-col gap-3 shrink-0 bg-[#1a1c23]">
                <div class="flex gap-2">
                    <input type="text" id="inp-quick-paste" placeholder="Paste raw <svg> code here..." class="flex-1 bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors">
                    <button id="btn-open-editor" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded border border-gray-700 transition-colors flex items-center justify-center" title="Full Editor">
                        <i class="ph ph-code"></i>
                    </button>
                </div>
                <div class="flex gap-2 justify-between items-center">
                    <div class="flex gap-1">
                        <button id="btn-undo" class="bg-gray-800 hover:bg-gray-700 text-gray-400 p-1.5 rounded border border-gray-700 transition-colors opacity-50 cursor-not-allowed" title="Undo"><i class="ph ph-arrow-u-up-left"></i></button>
                        <button id="btn-redo" class="bg-gray-800 hover:bg-gray-700 text-gray-400 p-1.5 rounded border border-gray-700 transition-colors opacity-50 cursor-not-allowed" title="Redo"><i class="ph ph-arrow-u-up-right"></i></button>
                    </div>
                    <button id="btn-download" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-1 transition-colors shadow shadow-indigo-900"><i class="ph ph-export"></i> Export Studio</button>
                </div>
            </div>

            <!-- Transform Inspector (Strict bounds applied here) -->
            <div id="panel-transform" class="p-4 border-b border-gray-800 bg-[#1c1f26] hidden flex-col gap-4 shrink-0 box-border w-full">
                <div class="flex items-center justify-between">
                    <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-wide flex items-center gap-1"><i class="ph-fill ph-bounding-box"></i> Object Inspector</h3>
                    <button id="btn-deselect" class="text-gray-400 hover:text-white"><i class="ph ph-x"></i></button>
                </div>
                
                <div class="grid grid-cols-2 gap-3 w-full">
                    <div class="flex flex-col gap-1 w-full min-w-0 overflow-hidden">
                        <label class="text-[10px] text-gray-400 font-semibold tracking-wider uppercase">Scale</label>
                        <div class="flex items-center gap-1 w-full">
                            <input type="range" id="tr-scale" min="0.1" max="5" step="0.1" value="1" class="flex-1 w-full min-w-0">
                            <span id="tr-scale-val" class="text-[10px] w-6 text-right shrink-0">1x</span>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1 w-full min-w-0 overflow-hidden">
                        <label class="text-[10px] text-gray-400 font-semibold tracking-wider uppercase">Rotate</label>
                        <div class="flex items-center gap-1 w-full">
                            <input type="range" id="tr-rotate" min="-180" max="180" step="1" value="0" class="flex-1 w-full min-w-0">
                            <span id="tr-rotate-val" class="text-[10px] w-6 text-right shrink-0">0°</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-1 border-t border-gray-700 pt-3 w-full min-w-0 overflow-hidden">
                    <label class="text-[10px] text-gray-400 font-semibold tracking-wider uppercase">Stroke Width</label>
                    <div class="flex items-center gap-1 w-full">
                        <input type="range" id="tr-stroke" min="0" max="20" step="0.5" value="1" class="flex-1 w-full min-w-0">
                        <span id="tr-stroke-val" class="text-[10px] w-8 text-right shrink-0">1px</span>
                    </div>
                </div>
                
                <div class="flex gap-2 mt-1 w-full">
                    <button id="btn-layer-up" class="flex-1 bg-gray-800 hover:bg-gray-700 py-1 rounded border border-gray-700 text-xs flex justify-center items-center gap-1 min-w-0"><i class="ph ph-caret-up"></i> Front</button>
                    <button id="btn-layer-down" class="flex-1 bg-gray-800 hover:bg-gray-700 py-1 rounded border border-gray-700 text-xs flex justify-center items-center gap-1 min-w-0"><i class="ph ph-caret-down"></i> Back</button>
                    <button id="btn-duplicate" class="bg-gray-800 hover:bg-gray-700 px-2 py-1 rounded border border-gray-700 text-blue-400 shrink-0"><i class="ph ph-copy"></i></button>
                    <button id="btn-delete" class="bg-gray-800 hover:bg-red-900/50 px-2 py-1 rounded border border-gray-700 text-red-400 shrink-0"><i class="ph ph-trash"></i></button>
                </div>
            </div>

            <!-- Dynamic Layers Container -->
            <div class="flex-1 overflow-y-auto p-3 flex flex-col gap-4 min-h-0" id="layers-container">
                <div class="h-full flex items-center justify-center flex-col text-gray-500 opacity-50">
                    <i class="ph ph-magic-wand text-4xl mb-2"></i>
                    <p class="text-xs text-center px-4">Paste SVG code to extract layers and colors.</p>
                </div>
            </div>
        </aside>

        <!-- RIGHT PANEL: Canvas -->
        <main class="flex-1 relative h-full flex flex-col min-w-0 bg-checker-dark transition-colors duration-300" id="canvas-bg-wrapper">
            
            <!-- Export Studio Panel -->
            <div id="export-studio" class="absolute top-4 right-4 z-40 bg-[#16181d]/95 backdrop-blur-md border border-gray-700 rounded-lg shadow-2xl p-4 w-72 hidden flex-col gap-4">
                <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                    <h3 class="text-white font-bold flex items-center gap-2 text-sm"><i class="ph-fill ph-export text-indigo-400"></i> Export Studio</h3>
                    <button id="btn-close-export" class="text-gray-400 hover:text-white transition-colors p-1 rounded hover:bg-gray-800"><i class="ph ph-x"></i></button>
                </div>
                
                <div class="flex flex-col gap-1.5">
                    <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Base File Name</label>
                    <input type="text" id="inp-export-name" value="image" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
                
                <div class="flex items-center justify-between bg-gray-900/50 p-2 rounded border border-gray-800">
                    <label class="text-xs text-gray-300 font-medium">Remove Background</label>
                    <input type="checkbox" id="chk-export-bg" class="accent-indigo-500 w-4 h-4 cursor-pointer">
                </div>
                
                <div class="border-t border-gray-800 pt-3 flex flex-col gap-2">
                    <label class="text-[11px] font-semibold text-indigo-400 uppercase tracking-wide flex items-center gap-1"><i class="ph ph-scissors"></i> Image Slicer Grid</label>
                    <div class="flex gap-2">
                        <div class="flex-1">
                            <label class="text-[10px] text-gray-500 block mb-1">Columns</label>
                            <input type="number" id="inp-split-cols" min="1" max="10" value="1" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1 text-sm text-white text-center focus:outline-none focus:border-indigo-500">
                        </div>
                        <div class="flex-1">
                            <label class="text-[10px] text-gray-500 block mb-1">Rows</label>
                            <input type="number" id="inp-split-rows" min="1" max="10" value="1" class="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1 text-sm text-white text-center focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <p class="text-[10px] text-gray-500 italic mt-1 leading-tight"><i class="ph-fill ph-info"></i> Grid lines will appear on canvas. Click and drag them to adjust slice boundaries.</p>
                </div>
                
                <button id="btn-run-export" class="w-full py-2 mt-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/20">
                    <i class="ph ph-download-simple text-lg"></i> Download Slices
                </button>
            </div>

            <!-- Canvas controls & BG toggle -->
            <div class="absolute bottom-4 left-4 z-20 flex bg-gray-900/80 backdrop-blur border border-gray-700 rounded p-1 shadow-lg pointer-events-auto items-center">
                
                <!-- Tool Switcher (The Core Fix) -->
                <button class="tool-btn p-1.5 rounded bg-indigo-600 text-white transition-colors" data-tool="select" title="Select / Edit Tool (V)"><i class="ph ph-cursor text-lg"></i></button>
                <button class="tool-btn p-1.5 rounded text-gray-400 hover:text-white transition-colors" data-tool="pan" title="Pan Canvas Tool (H)"><i class="ph ph-hand-palm text-lg"></i></button>
                
                <div class="w-px h-5 bg-gray-700 mx-2"></div>

                <button class="bg-toggle-btn p-1.5 rounded text-gray-400 hover:text-white transition-colors bg-gray-700 text-white" data-bg="bg-checker-dark" title="Dark Checker"><i class="ph ph-squares-four"></i></button>
                <button class="bg-toggle-btn p-1.5 rounded text-gray-400 hover:text-white transition-colors" data-bg="bg-checker-light" title="Light Checker"><i class="ph-fill ph-squares-four"></i></button>
                <button class="bg-toggle-btn p-1.5 rounded text-gray-400 hover:text-white transition-colors" data-bg="bg-[#ffffff]" title="Solid White"><i class="ph-fill ph-circle text-white"></i></button>
                <button class="bg-toggle-btn p-1.5 rounded text-gray-400 hover:text-white transition-colors" data-bg="bg-[#000000]" title="Solid Black"><i class="ph-fill ph-circle text-black"></i></button>
                
                <div class="w-px h-5 bg-gray-700 mx-2"></div>
                
                <button id="btn-zoom-out" class="p-1.5 rounded text-gray-400 hover:text-white transition-colors"><i class="ph ph-minus"></i></button>
                <span id="lbl-zoom" class="text-xs flex items-center px-2 text-gray-300 min-w-[50px] justify-center">100%</span>
                <button id="btn-zoom-in" class="p-1.5 rounded text-gray-400 hover:text-white transition-colors"><i class="ph ph-plus"></i></button>
            </div>

            <!-- Interactive Canvas Area -->
            <div class="absolute inset-0 overflow-hidden" id="preview-container">
                <div id="selection-box"></div>
                <div id="marquee" class="hidden opacity-0"></div>
                <!-- Removed pointer-events-none from here to allow direct clicking -->
                <div id="svg-wrapper" class="svg-container w-full h-full flex items-center justify-center drop-shadow-2xl origin-center" style="transform: scale(1) translate(0px, 0px);">
                    <!-- SVG gets injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Fullscreen Code Editor Modal -->
    <div id="editor-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex-col">
        <div class="bg-[#1e1e24] p-3 border-b border-gray-800 flex justify-between items-center shrink-0">
            <h2 class="text-white font-bold flex items-center gap-2"><i class="ph ph-code"></i> Source Editor</h2>
            <div class="flex gap-2">
                <button id="btn-format" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-xs transition-colors"><i class="ph ph-magic-wand"></i> Format</button>
                <button id="btn-save-editor" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded text-xs font-semibold transition-colors shadow">Apply Changes</button>
                <button id="btn-close-editor" class="text-gray-400 hover:text-white px-2"><i class="ph ph-x text-lg"></i></button>
            </div>
        </div>
        <div class="flex-1 min-h-0 relative">
            <textarea id="code-editor"></textarea>
        </div>
    </div>

    <script>
        let state = {
            doc: null,
            hierarchy: {},
            visibility: {},
            transform: { scale: 1, x: 0, y: 0 },
            history: [],
            historyIdx: -1,
            selectedNodeIds: [] 
        };
        
        let nodeIdCounter = 0;
        let codeMirrorInstance = null;
        let currentTool = 'select'; // Interaction Mode: 'select' or 'pan'
        
        let isDraggingCanvas = false;
        let isDraggingNode = false;
        let isMarqueeDragging = false;
        let isExportMode = false;
        let splitGrid = { vLines: [], hLines: [] };
        let draggingSplitLine = null;
        
        let dragStart = { x: 0, y: 0, panX: 0, panY: 0 };
        let marqueeStart = { x: 0, y: 0 };
        const MODERN_SWATCHES = ['#F43F5E', '#3B82F6', '#0EA5E9', '#10B981', '#F97316', '#8B5CF6', '#64748B', '#F59E0B'];

        const els = {
            wrapper: document.getElementById('svg-wrapper'),
            preview: document.getElementById('preview-container'),
            layersContainer: document.getElementById('layers-container'),
            zoomLbl: document.getElementById('lbl-zoom'),
            selectionBox: document.getElementById('selection-box'),
            marquee: document.getElementById('marquee'),
            bgWrapper: document.getElementById('canvas-bg-wrapper'),
            panelTransform: document.getElementById('panel-transform')
        };

        function setTool(toolName) {
            currentTool = toolName;
            document.querySelectorAll('.tool-btn').forEach(b => {
                if(b.getAttribute('data-tool') === toolName) {
                    b.classList.add('bg-indigo-600', 'text-white');
                    b.classList.remove('text-gray-400', 'hover:text-white');
                } else {
                    b.classList.remove('bg-indigo-600', 'text-white');
                    b.classList.add('text-gray-400', 'hover:text-white');
                }
            });

            // If in Pan mode, add pointer-events-none to SVG so we grab the background easily
            if (currentTool === 'pan') {
                els.wrapper.classList.add('pointer-events-none');
                els.preview.style.cursor = 'grab';
            } else {
                els.wrapper.classList.remove('pointer-events-none');
                els.preview.style.cursor = 'default';
            }
        }

        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(!isExportMode) setTool(e.currentTarget.getAttribute('data-tool'));
            });
        });

        function parseSVG(svgString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(svgString, "image/svg+xml");
            
            if (doc.querySelector("parsererror")) {
                console.error("Invalid SVG");
                return null;
            }

            const validTags = ['path', 'rect', 'circle', 'ellipse', 'line', 'polygon', 'polyline', 'text', 'tspan', 'image'];
            doc.querySelectorAll('*').forEach(el => {
                const tag = el.tagName.toLowerCase();
                const isLayer = tag === 'g' && el.getAttribute('inkscape:groupmode') === 'layer';
                if (validTags.includes(tag) && !isLayer) {
                    el.setAttribute('data-svg-forge-id', `f_${nodeIdCounter++}`);
                }
            });

            state.doc = doc;
            state.hierarchy = {};
            state.visibility = {};
            deselectNodes();
            
            buildHierarchy(doc.documentElement, "Root");
            renderUI();
            syncDomToCanvas();
        }

        function extractAlpha(colorStr, ...opacities) {
            let baseColor = colorStr;
            let alpha = 1.0;

            opacities.forEach(op => {
                if (op && !isNaN(parseFloat(op))) alpha *= parseFloat(op);
            });

            if (colorStr.startsWith('rgba')) {
                const match = colorStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
                if (match) {
                    baseColor = `#${(1 << 24 | match[1] << 16 | match[2] << 8 | match[3]).toString(16).slice(1)}`;
                    let internalAlpha = match[4] !== undefined ? parseFloat(match[4]) : 1;
                    alpha *= internalAlpha;
                }
            } else if (colorStr.startsWith('#') && colorStr.length === 9) {
                let internalAlpha = parseInt(colorStr.slice(7, 9), 16) / 255;
                alpha *= internalAlpha;
                baseColor = colorStr.slice(0, 7);
            }
            return { hex: baseColor.toUpperCase(), a: parseFloat(alpha.toFixed(3)) };
        }

        function hexToRgba(hex, alpha) {
            if(alpha === 1) return hex;
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function buildHierarchy(node, currentLayerName) {
            if (node.tagName && node.tagName.toLowerCase() === 'g') {
                const layerLabel = node.getAttribute('inkscape:label') || node.getAttribute('id');
                if (layerLabel && node.getAttribute('inkscape:groupmode') === 'layer') {
                    currentLayerName = layerLabel;
                }
            }

            if (!state.hierarchy[currentLayerName]) {
                state.hierarchy[currentLayerName] = { fills: {}, strokes: {}, texts: [], nodeIds: [] };
                if (state.visibility[currentLayerName] === undefined) state.visibility[currentLayerName] = true;
            }

            const id = node.getAttribute('data-svg-forge-id');
            if (id) {
                state.hierarchy[currentLayerName].nodeIds.push(id);
                
                const fill = node.getAttribute('fill');
                const stroke = node.getAttribute('stroke');
                const op = node.getAttribute('opacity');
                const fillOp = node.getAttribute('fill-opacity');
                const strokeOp = node.getAttribute('stroke-opacity');

                if (fill && fill !== 'none' && !fill.startsWith('url')) {
                    const parsed = extractAlpha(fill, op, fillOp);
                    const key = `${parsed.hex}_${parsed.a}`;
                    if (!state.hierarchy[currentLayerName].fills[key]) {
                        state.hierarchy[currentLayerName].fills[key] = { hex: parsed.hex, a: parsed.a, nodes: [] };
                    }
                    state.hierarchy[currentLayerName].fills[key].nodes.push(id);
                }

                if (stroke && stroke !== 'none' && !stroke.startsWith('url')) {
                    const parsed = extractAlpha(stroke, op, strokeOp);
                    const key = `${parsed.hex}_${parsed.a}`;
                    if (!state.hierarchy[currentLayerName].strokes[key]) {
                        state.hierarchy[currentLayerName].strokes[key] = { hex: parsed.hex, a: parsed.a, nodes: [] };
                    }
                    state.hierarchy[currentLayerName].strokes[key].nodes.push(id);
                }

                if (node.tagName.toLowerCase() === 'text' || node.tagName.toLowerCase() === 'tspan') {
                    const tContent = node.textContent.trim();
                    if(tContent) {
                        state.hierarchy[currentLayerName].texts.push({ id, text: tContent });
                    }
                }
            }

            Array.from(node.children).forEach(child => buildHierarchy(child, currentLayerName));
        }

        function renderUI() {
            els.layersContainer.innerHTML = '';
            
            Object.entries(state.hierarchy).forEach(([layerName, data]) => {
                const fKeys = Object.keys(data.fills);
                const sKeys = Object.keys(data.strokes);
                if (fKeys.length === 0 && sKeys.length === 0 && data.texts.length === 0) return;

                const isVis = state.visibility[layerName];

                let html = `
                    <div class="layer-card bg-[#1c1f26] border border-gray-800 rounded-lg overflow-hidden" data-layer-name="${layerName}">
                        <div class="bg-gray-800/50 px-3 py-2 flex justify-between items-center border-b border-gray-800">
                            <h3 class="font-semibold text-gray-300 text-xs flex items-center gap-1.5"><i class="ph ph-stack"></i> ${layerName}</h3>
                            <button class="toggle-vis text-gray-400 hover:text-white" data-layer="${layerName}">
                                <i class="ph ${isVis ? 'ph-eye' : 'ph-eye-closed'}"></i>
                            </button>
                        </div>
                        <div class="p-3 flex flex-col gap-4 ${isVis ? '' : 'opacity-30 pointer-events-none'}">
                `;

                if (fKeys.length > 0) {
                    html += `<div class="flex flex-col gap-2"><div class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Fills</div>`;
                    fKeys.forEach(key => html += createColorRow(layerName, 'fill', key, data.fills[key]));
                    html += `</div>`;
                }

                if (sKeys.length > 0) {
                    html += `<div class="flex flex-col gap-2"><div class="text-[10px] text-gray-500 uppercase tracking-widest font-bold mt-2">Strokes</div>`;
                    sKeys.forEach(key => html += createColorRow(layerName, 'stroke', key, data.strokes[key]));
                    html += `</div>`;
                }
                
                if (data.texts.length > 0) {
                     html += `<div class="flex flex-col gap-2"><div class="text-[10px] text-gray-500 uppercase tracking-widest font-bold mt-2">Text Content</div>`;
                     data.texts.forEach(t => {
                         html += `
                         <div class="flex flex-col gap-1 item-row" data-nodes='["${t.id}"]'>
                             <input type="text" value="${t.text}" class="text-input w-full bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500" data-id="${t.id}">
                         </div>`;
                     });
                     html += `</div>`;
                }

                html += `</div></div>`;
                els.layersContainer.insertAdjacentHTML('beforeend', html);
            });

            attachUIListeners();
        }

        function createColorRow(layer, type, key, colorObj) {
            const swatchHtml = MODERN_SWATCHES.map(hex => 
                `<button class="preset-swatch w-4 h-4 rounded border border-gray-700 hover:scale-110 transition-transform" style="background-color: ${hex}" data-hex="${hex}"></button>`
            ).join('');

            return `
                <div class="flex flex-col gap-2 p-2 bg-gray-900/50 rounded border border-gray-800 item-row" data-nodes='${JSON.stringify(colorObj.nodes)}'>
                    <div class="flex items-center gap-3">
                        <div class="relative w-8 h-8 rounded border border-gray-700 overflow-hidden shrink-0">
                            <div class="absolute inset-0 bg-checker-light"></div>
                            <input type="color" value="${colorObj.hex}" class="color-picker absolute inset-[-10px] w-[50px] h-[50px] cursor-pointer" data-layer="${layer}" data-type="${type}" data-old="${key}">
                        </div>
                        <div class="flex-1 flex flex-col gap-1 min-w-0">
                            <div class="flex gap-2">
                                <input type="text" value="${colorObj.hex}" class="hex-input flex-1 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-white font-mono uppercase focus:outline-none focus:border-indigo-500 w-full min-w-0" data-layer="${layer}" data-type="${type}" data-old="${key}">
                                <div class="flex items-center gap-1 w-16 shrink-0">
                                    <i class="ph ph-drop text-gray-500"></i>
                                    <input type="range" min="0" max="1" step="0.05" value="${colorObj.a}" class="alpha-slider flex-1 min-w-0" data-layer="${layer}" data-type="${type}" data-old="${key}">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between mt-1 px-1">${swatchHtml}</div>
                </div>
            `;
        }

        function attachUIListeners() {
            document.querySelectorAll('.toggle-vis').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const layer = e.currentTarget.getAttribute('data-layer');
                    state.visibility[layer] = !state.visibility[layer];
                    renderUI();
                    syncDomToCanvas();
                });
            });

            document.querySelectorAll('.color-picker, .hex-input').forEach(el => {
                el.addEventListener('input', (e) => {
                    const layer = e.target.getAttribute('data-layer');
                    const type = e.target.getAttribute('data-type');
                    const oldKey = e.target.getAttribute('data-old');
                    const newHex = e.target.value.toUpperCase();
                    if(/^#[0-9A-F]{6}$/i.test(newHex)) updateColor(layer, type, oldKey, newHex);
                });
                el.addEventListener('change', () => syncDomToCanvas(true)); 
            });

            document.querySelectorAll('.alpha-slider').forEach(el => {
                el.addEventListener('input', (e) => {
                    const layer = e.target.getAttribute('data-layer');
                    const type = e.target.getAttribute('data-type');
                    const oldKey = e.target.getAttribute('data-old');
                    const newAlpha = parseFloat(e.target.value);
                    updateOpacity(layer, type, oldKey, newAlpha);
                });
                el.addEventListener('change', () => syncDomToCanvas(true));
            });

            document.querySelectorAll('.preset-swatch').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const container = e.target.closest('.item-row');
                    const hexInput = container.querySelector('.hex-input');
                    hexInput.value = e.target.getAttribute('data-hex');
                    hexInput.dispatchEvent(new Event('input'));
                    syncDomToCanvas(true);
                });
            });

            document.querySelectorAll('.text-input').forEach(el => {
                el.addEventListener('input', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const node = state.doc.querySelector(`[data-svg-forge-id="${id}"]`);
                    if(node) {
                        node.textContent = e.target.value;
                        syncDomToCanvas(false);
                    }
                });
                el.addEventListener('change', () => syncDomToCanvas(true));
            });

            document.querySelectorAll('.item-row').forEach(row => {
                row.addEventListener('mouseenter', () => highlightNodes(JSON.parse(row.getAttribute('data-nodes'))));
                row.addEventListener('mouseleave', () => clearHighlights());
            });
        }

        function updateColor(layerName, type, oldKey, newHex) {
            const data = state.hierarchy[layerName][type + 's'][oldKey];
            if (!data) return;
            const rgba = hexToRgba(newHex, data.a);
            
            data.nodes.forEach(id => {
                const node = state.doc.querySelector(`[data-svg-forge-id="${id}"]`);
                if (node) {
                    node.setAttribute(type, rgba);
                    node.removeAttribute('opacity');
                    node.removeAttribute('fill-opacity');
                    node.removeAttribute('stroke-opacity');
                }
            });
            syncDomToCanvas(false); 
        }

        function updateOpacity(layerName, type, oldKey, newAlpha) {
            const data = state.hierarchy[layerName][type + 's'][oldKey];
            if (!data) return;
            const rgba = hexToRgba(data.hex, newAlpha);
            
            data.nodes.forEach(id => {
                const node = state.doc.querySelector(`[data-svg-forge-id="${id}"]`);
                if (node) {
                    node.setAttribute(type, rgba);
                    node.removeAttribute('opacity');
                    node.removeAttribute('fill-opacity');
                    node.removeAttribute('stroke-opacity');
                }
            });
            syncDomToCanvas(false); 
        }

        function syncDomToCanvas(saveToHistory = true) {
            Object.entries(state.visibility).forEach(([layerName, isVis]) => {
                const nodeIds = state.hierarchy[layerName]?.nodeIds || [];
                nodeIds.forEach(id => {
                    const node = state.doc.querySelector(`[data-svg-forge-id="${id}"]`);
                    if(node) node.style.display = isVis === false ? 'none' : '';
                });
            });

            const str = new XMLSerializer().serializeToString(state.doc.documentElement);
            const cleanStr = str.replace(/xmlns:xmlns=".*?"/g, ''); 
            
            els.wrapper.innerHTML = cleanStr;
            applyTransform();

            if (saveToHistory) pushHistory();
            if (state.selectedNodeIds.length > 0) updateSelectionBox();
            if (isExportMode) drawSplitGrid();
        }

        function applyTransform() {
            els.wrapper.style.transform = `translate(${state.transform.x}px, ${state.transform.y}px) scale(${state.transform.scale})`;
            els.zoomLbl.innerText = `${Math.round(state.transform.scale * 100)}%`;
        }

        function screenToSVG(x, y) {
            const svg = els.wrapper.querySelector('svg');
            if (!svg) return {x, y};
            const pt = svg.createSVGPoint();
            pt.x = x; pt.y = y;
            const ctm = svg.getScreenCTM();
            if(!ctm) return {x, y};
            return pt.matrixTransform(ctm.inverse());
        }

        function updateSelectionBox() {
            if (state.selectedNodeIds.length === 0) {
                els.selectionBox.classList.remove('active');
                els.panelTransform.classList.add('hidden');
                els.panelTransform.classList.remove('flex');
                return;
            }

            const svg = els.wrapper.querySelector('svg');
            if(!svg) return;
            const ctm = svg.getScreenCTM();
            if(!ctm) return;

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

            state.selectedNodeIds.forEach(id => {
                const visualNode = els.wrapper.querySelector(`[data-svg-forge-id="${id}"]`);
                if(visualNode && visualNode.getBoundingClientRect) {
                    const rect = visualNode.getBoundingClientRect();
                    if (rect.width > 0 && rect.height > 0) {
                        minX = Math.min(minX, rect.left);
                        minY = Math.min(minY, rect.top);
                        maxX = Math.max(maxX, rect.right);
                        maxY = Math.max(maxY, rect.bottom);
                    }
                }
            });

            if (minX !== Infinity) {
                const parentRect = els.preview.getBoundingClientRect();
                els.selectionBox.style.left = (minX - parentRect.left - 4) + 'px';
                els.selectionBox.style.top = (minY - parentRect.top - 4) + 'px';
                els.selectionBox.style.width = (maxX - minX + 8) + 'px';
                els.selectionBox.style.height = (maxY - minY + 8) + 'px';
                els.selectionBox.classList.add('active');
                
                els.panelTransform.classList.remove('hidden');
                els.panelTransform.classList.add('flex');
                updateTransformInspectorValues();
                
                // Highlight layers in sidebar
                document.querySelectorAll('.layer-card').forEach(c => c.classList.remove('highlight'));
                state.selectedNodeIds.forEach(id => {
                    const row = els.layersContainer.querySelector(`.item-row[data-nodes*="${id}"]`);
                    if(row) row.closest('.layer-card').classList.add('highlight');
                });
            }
        }

        function deselectNodes() {
            state.selectedNodeIds = [];
            updateSelectionBox();
            document.querySelectorAll('.layer-card').forEach(c => c.classList.remove('highlight'));
            clearHighlights();
        }

        function highlightNodes(ids) {
            ids.forEach(id => {
                const node = els.wrapper.querySelector(`[data-svg-forge-id="${id}"]`);
                if(node) node.style.filter = 'drop-shadow(0 0 5px #38bdf8) brightness(1.2)';
            });
            els.wrapper.style.opacity = '0.7';
        }

        function clearHighlights() {
            els.wrapper.querySelectorAll('*').forEach(n => n.style.filter = '');
            els.wrapper.style.opacity = '1';
        }

        function isBackground(node) {
            if(node.tagName.toLowerCase() !== 'rect') return false;
            const svg = els.wrapper.querySelector('svg');
            if(!svg) return false;
            let w = node.getAttribute('width');
            let h = node.getAttribute('height');
            if(!w || !h) return false;
            
            if(w.includes('%') || h.includes('%')) return true;

            w = parseFloat(w); h = parseFloat(h);
            const vb = svg.viewBox ? svg.viewBox.baseVal : null;
            const svgW = vb && vb.width > 0 ? vb.width : parseFloat(svg.getAttribute('width')||800);
            const svgH = vb && vb.height > 0 ? vb.height : parseFloat(svg.getAttribute('height')||600);
            
            return (w >= svgW * 0.95 && h >= svgH * 0.95);
        }

        els.preview.addEventListener('wheel', (e) => {
            if(e.ctrlKey || e.metaKey) return; 
            e.preventDefault();
            const zoomDelta = e.deltaY > 0 ? 0.9 : 1.1;
            state.transform.scale = Math.max(0.1, Math.min(20, state.transform.scale * zoomDelta));
            applyTransform();
            updateSelectionBox();
            if (isExportMode) drawSplitGrid();
        });

        els.preview.addEventListener('contextmenu', e => e.preventDefault());

        els.preview.addEventListener('mousedown', (e) => {
            // Right Click = Marquee Select
            if (e.button === 2 && !isExportMode) {
                e.preventDefault(); e.stopPropagation();
                isMarqueeDragging = true;
                const rect = els.preview.getBoundingClientRect();
                marqueeStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
                els.marquee.style.left = marqueeStart.x + 'px';
                els.marquee.style.top = marqueeStart.y + 'px';
                els.marquee.style.width = '0px';
                els.marquee.style.height = '0px';
                els.marquee.classList.remove('hidden', 'opacity-0');
                return;
            }

            if (e.button !== 0) return; 
            
            // Priority 1: Check if clicking Export Grid Lines
            if (isExportMode && e.target && e.target.classList && e.target.classList.contains('split-line')) {
                draggingSplitLine = {
                    type: e.target.getAttribute('data-split-type'),
                    index: parseInt(e.target.getAttribute('data-split-index')),
                    elem: e.target
                };
                e.stopPropagation();
                return;
            }

            // If Pan Tool is active OR Export Mode is active (and we missed grid lines), FORCE Canvas Panning.
            if (currentTool === 'pan' || isExportMode) {
                isDraggingCanvas = true;
                dragStart = { x: e.clientX, y: e.clientY, panX: state.transform.x, panY: state.transform.y, moved: false };
                els.preview.style.cursor = 'grabbing';
                return;
            }

            // Normal Select Mode Logic
            let target = e.target;
            let foundId = null;
            
            while (target && target !== els.wrapper && target !== document) {
                if (target.hasAttribute && target.hasAttribute('data-svg-forge-id')) {
                    foundId = target.getAttribute('data-svg-forge-id');
                    break;
                }
                target = target.parentNode;
            }

            if (foundId && !isBackground(target)) {
                e.stopPropagation();
                if (!e.shiftKey && !state.selectedNodeIds.includes(foundId)) {
                    state.selectedNodeIds = [foundId];
                } else if (e.shiftKey && !state.selectedNodeIds.includes(foundId)) {
                    state.selectedNodeIds.push(foundId);
                }
                
                isDraggingNode = true;
                dragStart = { x: e.clientX, y: e.clientY, moved: false };
                updateSelectionBox();
                
                const activeCard = els.layersContainer.querySelector(`.item-row[data-nodes*="${foundId}"]`)?.closest('.layer-card');
                if (activeCard) activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                // Clicked Empty Space in Select Mode
                deselectNodes();
                isDraggingCanvas = true;
                dragStart = { x: e.clientX, y: e.clientY, panX: state.transform.x, panY: state.transform.y, moved: false };
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isMarqueeDragging) {
                const rect = els.preview.getBoundingClientRect();
                const curX = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
                const curY = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
                
                els.marquee.style.left = Math.min(marqueeStart.x, curX) + 'px';
                els.marquee.style.top = Math.min(marqueeStart.y, curY) + 'px';
                els.marquee.style.width = Math.abs(curX - marqueeStart.x) + 'px';
                els.marquee.style.height = Math.abs(curY - marqueeStart.y) + 'px';
                return;
            }
            
            if (draggingSplitLine) {
                const svgP = screenToSVG(e.clientX, e.clientY);
                const info = getBaseSVGViewBox(); // Get true bounds to prevent dragging out of bounds
                if (!info) return;

                if (draggingSplitLine.type === 'v') {
                    let clampedX = Math.max(info.vb.x, Math.min(info.vb.x + info.vb.width, svgP.x));
                    splitGrid.vLines[draggingSplitLine.index] = clampedX;
                    draggingSplitLine.elem.setAttribute('x1', clampedX);
                    draggingSplitLine.elem.setAttribute('x2', clampedX);
                } else {
                    let clampedY = Math.max(info.vb.y, Math.min(info.vb.y + info.vb.height, svgP.y));
                    splitGrid.hLines[draggingSplitLine.index] = clampedY;
                    draggingSplitLine.elem.setAttribute('y1', clampedY);
                    draggingSplitLine.elem.setAttribute('y2', clampedY);
                }
                return;
            }

            if (isDraggingNode && state.selectedNodeIds.length > 0) {
                dragStart.moved = true;
                const p1 = screenToSVG(dragStart.x, dragStart.y);
                const p2 = screenToSVG(e.clientX, e.clientY);
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                
                state.selectedNodeIds.forEach(id => {
                    const visualNode = els.wrapper.querySelector(`[data-svg-forge-id="${id}"]`);
                    const docNode = state.doc.querySelector(`[data-svg-forge-id="${id}"]`);
                    if(visualNode && docNode) applyNodeTransform(visualNode, docNode, dx, dy, null, null);
                });
                
                dragStart.x = e.clientX;
                dragStart.y = e.clientY;
                updateSelectionBox();
                return;
            }

            if (isDraggingCanvas) {
                if (Math.abs(e.clientX - dragStart.x) > 3 || Math.abs(e.clientY - dragStart.y) > 3) dragStart.moved = true;
                state.transform.x = dragStart.panX + (e.clientX - dragStart.x);
                state.transform.y = dragStart.panY + (e.clientY - dragStart.y);
                applyTransform();
                updateSelectionBox();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (draggingSplitLine) {
                draggingSplitLine = null;
                return;
            }

            if (isMarqueeDragging) {
                isMarqueeDragging = false;
                els.marquee.classList.add('hidden', 'opacity-0');
                
                const mRect = els.marquee.getBoundingClientRect();
                if (!e.shiftKey) state.selectedNodeIds = [];
                
                els.wrapper.querySelectorAll('[data-svg-forge-id]').forEach(node => {
                    if(isBackground(node)) return;
                    const nRect = node.getBoundingClientRect();
                    // Must be fully inside bounding box
                    if (nRect.width > 0 && nRect.height > 0 &&
                        nRect.left >= mRect.left && nRect.right <= mRect.right && 
                        nRect.top >= mRect.top && nRect.bottom <= mRect.bottom) {
                        const id = node.getAttribute('data-svg-forge-id');
                        if (!state.selectedNodeIds.includes(id)) state.selectedNodeIds.push(id);
                    }
                });
                updateSelectionBox();
                return;
            }

            if (isDraggingNode && dragStart.moved) syncDomToCanvas(true); 
            isDraggingNode = false;
            isDraggingCanvas = false;
            
            if (currentTool === 'pan' || isExportMode) {
                els.preview.style.cursor = 'grab';
            }
        });

        function applyNodeTransform(vNode, dNode, addDx = 0, addDy = 0, setScale = null, setRot = null) {
            let tr = dNode.getAttribute('transform') || '';
            let tx = 0, ty = 0, rot = 0, scale = 1;
            
            const tMatch = tr.match(/translate\(([-\d.]+)[ ,]+([-\d.]+)\)/);
            const rMatch = tr.match(/rotate\(([-\d.]+)[ ,]*[-\d.]*[ ,]*[-\d.]*\)/);
            const sMatch = tr.match(/scale\(([-\d.]+)\)/);
            
            if(tMatch) { tx = parseFloat(tMatch[1]); ty = parseFloat(tMatch[2]); }
            if(rMatch) { rot = parseFloat(rMatch[1]); }
            if(sMatch) { scale = parseFloat(sMatch[1]); }

            tx += addDx; ty += addDy;
            if (setScale !== null) scale = setScale;
            if (setRot !== null) rot = setRot;

            let newTr = `translate(${tx}, ${ty})`;
            if (rot !== 0) {
                const bb = vNode.getBBox();
                const cx = bb.x + bb.width / 2;
                const cy = bb.y + bb.height / 2;
                newTr += ` rotate(${rot} ${cx} ${cy})`;
            }
            if (scale !== 1) newTr += ` scale(${scale})`;

            vNode.setAttribute('transform', newTr);
            dNode.setAttribute('transform', newTr); 
        }

        function updateTransformInspectorValues() {
            if (state.selectedNodeIds.length === 0) return;
            const node = els.wrapper.querySelector(`[data-svg-forge-id="${state.selectedNodeIds[0]}"]`);
            if(!node) return;
            
            let tr = node.getAttribute('transform') || '';
            let rot = 0, scale = 1;
            const rMatch = tr.match(/rotate\(([-\d.]+)/);
            const sMatch = tr.match(/scale\(([-\d.]+)\)/);
            if(rMatch) rot = parseFloat(rMatch[1]);
            if(sMatch) scale = parseFloat(sMatch[1]);
            
            document.getElementById('tr-scale').value = scale;
            document.getElementById('tr-scale-val').innerText = `${scale}x`;
            document.getElementById('tr-rotate').value = rot;
            document.getElementById('tr-rotate-val').innerText = `${rot}°`;

            let sWidth = parseFloat(node.getAttribute('stroke-width') || "1");
            document.getElementById('tr-stroke').value = sWidth;
            document.getElementById('tr-stroke-val').innerText = `${sWidth}px`;
        }

        document.getElementById('tr-scale').addEventListener('input', e => {
            const val = parseFloat(e.target.value);
            document.getElementById('tr-scale-val').innerText = `${val}x`;
            state.selectedNodeIds.forEach(id => {
                const vNode = els.wrapper.querySelector(`[data-svg-forge-id="${id}"]`);
                const dNode = state.doc.querySelector(`[data-svg-forge-id="${id}"]`);
                if(vNode && dNode) applyNodeTransform(vNode, dNode, 0, 0, val, null);
            });
            updateSelectionBox();
        });
        document.getElementById('tr-scale').addEventListener('change', () => syncDomToCanvas(true));

        document.getElementById('tr-rotate').addEventListener('input', e => {
            const val = parseFloat(e.target.value);
            document.getElementById('tr-rotate-val').innerText = `${val}°`;
            state.selectedNodeIds.forEach(id => {
                const vNode = els.wrapper.querySelector(`[data-svg-forge-id="${id}"]`);
                const dNode = state.doc.querySelector(`[data-svg-forge-id="${id}"]`);
                if(vNode && dNode) applyNodeTransform(vNode, dNode, 0, 0, null, val);
            });
            updateSelectionBox();
        });
        document.getElementById('tr-rotate').addEventListener('change', () => syncDomToCanvas(true));

        document.getElementById('tr-stroke').addEventListener('input', e => {
            const val = parseFloat(e.target.value);
            document.getElementById('tr-stroke-val').innerText = `${val}px`;
            state.selectedNodeIds.forEach(id => {
                const vNode = els.wrapper.querySelector(`[data-svg-forge-id="${id}"]`);
                const dNode = state.doc.querySelector(`[data-svg-forge-id="${id}"]`);
                if(vNode && dNode) {
                    vNode.setAttribute('stroke-width', val);
                    dNode.setAttribute('stroke-width', val);
                }
            });
            updateSelectionBox();
        });
        document.getElementById('tr-stroke').addEventListener('change', () => syncDomToCanvas(true));

        document.getElementById('btn-layer-up').addEventListener('click', () => {
            state.selectedNodeIds.forEach(id => {
                const n = state.doc.querySelector(`[data-svg-forge-id="${id}"]`);
                if(n && n.nextElementSibling) n.parentNode.insertBefore(n.nextElementSibling, n);
            });
            syncDomToCanvas(true);
        });
        document.getElementById('btn-layer-down').addEventListener('click', () => {
            state.selectedNodeIds.forEach(id => {
                const n = state.doc.querySelector(`[data-svg-forge-id="${id}"]`);
                if(n && n.previousElementSibling) n.parentNode.insertBefore(n, n.previousElementSibling);
            });
            syncDomToCanvas(true);
        });
        document.getElementById('btn-duplicate').addEventListener('click', () => {
            let newSelection = [];
            state.selectedNodeIds.forEach(id => {
                const n = state.doc.querySelector(`[data-svg-forge-id="${id}"]`);
                if(n) {
                    const clone = n.cloneNode(true);
                    const newId = `f_${nodeIdCounter++}`;
                    clone.setAttribute('data-svg-forge-id', newId);
                    applyNodeTransform(clone, clone, 20, 20, null, null); 
                    n.parentNode.insertBefore(clone, n.nextSibling);
                    newSelection.push(newId);
                }
            });
            parseSVG(new XMLSerializer().serializeToString(state.doc.documentElement));
            state.selectedNodeIds = newSelection;
            updateSelectionBox();
        });
        document.getElementById('btn-delete').addEventListener('click', () => {
            state.selectedNodeIds.forEach(id => {
                const n = state.doc.querySelector(`[data-svg-forge-id="${id}"]`);
                if(n) n.remove();
            });
            deselectNodes();
            parseSVG(new XMLSerializer().serializeToString(state.doc.documentElement));
        });
        document.getElementById('btn-deselect').addEventListener('click', deselectNodes);

        window.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedNodeIds.length > 0) {
                document.getElementById('btn-delete').click();
            }
            if (e.key === 'Escape') deselectNodes();
            
            if (e.key.toLowerCase() === 'v' && !isExportMode) setTool('select');
            if (e.key.toLowerCase() === 'h' && !isExportMode) setTool('pan');
        });

        function pushHistory() {
            if (!state.doc) return;
            const str = new XMLSerializer().serializeToString(state.doc.documentElement);
            if (state.history[state.historyIdx] === str) return;
            
            state.history = state.history.slice(0, state.historyIdx + 1);
            state.history.push(str);
            state.historyIdx++;
            updateHistoryButtons();
        }

        function updateHistoryButtons() {
            document.getElementById('btn-undo').className = `bg-gray-800 p-1.5 rounded border border-gray-700 transition-colors ${state.historyIdx > 0 ? 'text-white hover:bg-gray-700 cursor-pointer' : 'text-gray-500 opacity-50 cursor-not-allowed'}`;
            document.getElementById('btn-redo').className = `bg-gray-800 p-1.5 rounded border border-gray-700 transition-colors ${state.historyIdx < state.history.length - 1 ? 'text-white hover:bg-gray-700 cursor-pointer' : 'text-gray-500 opacity-50 cursor-not-allowed'}`;
        }

        document.getElementById('btn-undo').addEventListener('click', () => {
            if (state.historyIdx > 0) {
                state.historyIdx--;
                parseSVG(state.history[state.historyIdx]);
            }
        });
        document.getElementById('btn-redo').addEventListener('click', () => {
            if (state.historyIdx < state.history.length - 1) {
                state.historyIdx++;
                parseSVG(state.history[state.historyIdx]);
            }
        });

        document.querySelectorAll('.bg-toggle-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.bg-toggle-btn').forEach(b => b.classList.remove('bg-gray-700', 'text-white'));
                const target = e.currentTarget;
                target.classList.add('bg-gray-700', 'text-white');
                els.bgWrapper.className = 'flex-1 relative h-full flex flex-col min-w-0 transition-colors duration-300';
                els.bgWrapper.classList.add(target.getAttribute('data-bg'));
            });
        });

        const exportStudio = document.getElementById('export-studio');
        
        function toggleExportStudio(show) {
            isExportMode = show;
            if (show) {
                exportStudio.classList.remove('hidden');
                exportStudio.classList.add('flex');
                deselectNodes();
                updateSplitGrid(true);
                // Force wrapper to ignore clicks so we can grab grid lines easily
                els.wrapper.classList.add('pointer-events-none');
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.add('opacity-50', 'pointer-events-none'));
            } else {
                exportStudio.classList.add('hidden');
                exportStudio.classList.remove('flex');
                drawSplitGrid(); // clear grid
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('opacity-50', 'pointer-events-none'));
                setTool(currentTool); // Restore previous tool state properly
            }
        }

        document.getElementById('btn-download').addEventListener('click', () => toggleExportStudio(true));
        document.getElementById('btn-close-export').addEventListener('click', () => toggleExportStudio(false));

        function getBaseSVGViewBox() {
            const svg = els.wrapper.querySelector('svg');
            if (!svg) return null;
            
            let x = 0, y = 0, w = 800, h = 600;
            
            try {
                // Ignore the hardcoded attributes and find the TRUE visual boundaries of all elements
                const bbox = svg.getBBox();
                if (bbox && bbox.width > 0 && bbox.height > 0) {
                    x = bbox.x;
                    y = bbox.y;
                    w = bbox.width;
                    h = bbox.height;
                }
            } catch (e) { }

            // Fallback & Merge with original viewBox or width/height attributes
            const explicitVb = svg.viewBox ? svg.viewBox.baseVal : null;
            
            if (explicitVb && explicitVb.width > 0) {
                // Expand slicing area to whichever is larger: the defined viewBox or the true drawn elements
                const endX = Math.max(x + w, explicitVb.x + explicitVb.width);
                const endY = Math.max(y + h, explicitVb.y + explicitVb.height);
                x = Math.min(x, explicitVb.x);
                y = Math.min(y, explicitVb.y);
                w = endX - x;
                h = endY - y;
            } else {
                let origW = parseFloat(svg.getAttribute('width')) || (w > 0 ? w : 800);
                let origH = parseFloat(svg.getAttribute('height')) || (h > 0 ? h : 600);
                
                const endX = Math.max(x + w, origW);
                const endY = Math.max(y + h, origH);
                x = Math.min(x, 0);
                y = Math.min(y, 0);
                w = endX - x;
                h = endY - y;
            }
            
            // Add a tiny 2px buffer to ensure thick strokes on the outer edges aren't clipped
            return { svg, vb: { x: x - 2, y: y - 2, width: w + 4, height: h + 4 } };
        }

        function updateSplitGrid(forceReset = false) {
            if (!isExportMode) return;
            const cols = parseInt(document.getElementById('inp-split-cols').value) || 1;
            const rows = parseInt(document.getElementById('inp-split-rows').value) || 1;
            const info = getBaseSVGViewBox();
            if (!info) return;
            
            if (forceReset || splitGrid.vLines.length !== cols - 1) {
                splitGrid.vLines = [];
                for (let i = 1; i < cols; i++) splitGrid.vLines.push(info.vb.x + (info.vb.width / cols) * i);
            }
            if (forceReset || splitGrid.hLines.length !== rows - 1) {
                splitGrid.hLines = [];
                for (let i = 1; i < rows; i++) splitGrid.hLines.push(info.vb.y + (info.vb.height / rows) * i);
            }
            drawSplitGrid();
        }

        function drawSplitGrid() {
            const info = getBaseSVGViewBox();
            if (!info) return;
            
            let overlay = info.svg.querySelector('#export-grid-overlay');
            if (overlay) overlay.remove();
            
            if (!isExportMode || (splitGrid.vLines.length === 0 && splitGrid.hLines.length === 0)) return;
            
            overlay = document.createElementNS("http://www.w3.org/2000/svg", "g");
            overlay.id = 'export-grid-overlay';
            
            splitGrid.vLines.forEach((x, i) => {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute('x1', x); line.setAttribute('y1', info.vb.y);
                line.setAttribute('x2', x); line.setAttribute('y2', info.vb.y + info.vb.height);
                line.setAttribute('class', 'split-line');
                // Extremely thick stroke with auto events so it's super easy to grab!
                line.setAttribute('style', 'stroke: #06b6d4; stroke-width: 6; stroke-dasharray: 8,6; cursor: col-resize; pointer-events: auto; vector-effect: non-scaling-stroke;');
                line.setAttribute('data-split-type', 'v');
                line.setAttribute('data-split-index', i);
                overlay.appendChild(line);
            });
            
            splitGrid.hLines.forEach((y, i) => {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute('x1', info.vb.x); line.setAttribute('y1', y);
                line.setAttribute('x2', info.vb.x + info.vb.width); line.setAttribute('y2', y);
                line.setAttribute('class', 'split-line');
                // Extremely thick stroke with auto events so it's super easy to grab!
                line.setAttribute('style', 'stroke: #06b6d4; stroke-width: 6; stroke-dasharray: 8,6; cursor: row-resize; pointer-events: auto; vector-effect: non-scaling-stroke;');
                line.setAttribute('data-split-type', 'h');
                line.setAttribute('data-split-index', i);
                overlay.appendChild(line);
            });
            
            info.svg.appendChild(overlay);
        }

        document.getElementById('inp-split-cols').addEventListener('input', () => updateSplitGrid(true));
        document.getElementById('inp-split-rows').addEventListener('input', () => updateSplitGrid(true));

        document.getElementById('btn-run-export').addEventListener('click', () => {
            const baseName = document.getElementById('inp-export-name').value || 'image';
            const removeBg = document.getElementById('chk-export-bg').checked;
            const info = getBaseSVGViewBox();
            if (!info) return;

            let xs = [info.vb.x, ...splitGrid.vLines.slice().sort((a,b)=>a-b), info.vb.x + info.vb.width];
            let ys = [info.vb.y, ...splitGrid.hLines.slice().sort((a,b)=>a-b), info.vb.y + info.vb.height];
            
            const clone = state.doc.documentElement.cloneNode(true);
            clone.querySelectorAll('[data-svg-forge-id]').forEach(el => el.removeAttribute('data-svg-forge-id'));
            
            if (removeBg) {
                // Heuristics: Strip obvious backgrounds before slicing so no crop ever has it
                clone.style.background = 'none';
                clone.style.backgroundColor = 'transparent';
                clone.querySelectorAll('g').forEach(g => {
                    const label = (g.getAttribute('inkscape:label') || '').toLowerCase();
                    const id = (g.id || '').toLowerCase();
                    if (label.includes('background') || label === 'bg' || id.includes('bg-layer') || id === 'background') g.remove();
                });
                // Find top level full-size rect
                const firstRect = clone.querySelector('rect');
                if (firstRect) {
                    const rw = firstRect.getAttribute('width');
                    const rh = firstRect.getAttribute('height');
                    if (rw === '100%' || rh === '100%' || (parseFloat(rw) >= info.vb.width * 0.95 && parseFloat(rh) >= info.vb.height * 0.95)) {
                        // Protect single-shape SVGs from deletion
                        if (clone.querySelectorAll('rect, circle, ellipse, polygon, path, line, text').length > 1) {
                            firstRect.remove();
                        }
                    }
                }
            }
            
            let count = 1;
            const totalSlices = (xs.length - 1) * (ys.length - 1);
            
            for (let i = 0; i < ys.length - 1; i++) {
                for (let j = 0; j < xs.length - 1; j++) {
                    const cw = xs[j+1] - xs[j];
                    const ch = ys[i+1] - ys[i];
                    
                    // Safety: Skip invalid or 0-pixel slices if user dragged lines exactly to the edge
                    if (cw <= 1 || ch <= 1) continue; 
                    
                    const cellClone = clone.cloneNode(true);
                    cellClone.setAttribute('viewBox', `${xs[j]} ${ys[i]} ${cw} ${ch}`);
                    cellClone.setAttribute('width', cw);
                    cellClone.setAttribute('height', ch);
                    
                    const str = new XMLSerializer().serializeToString(cellClone).replace(/xmlns:xmlns=".*?"/g, '');
                    const finalName = totalSlices > 1 ? `${baseName}-${count}.svg` : `${baseName}.svg`;
                    
                    setTimeout(() => {
                        const blob = new Blob([str], {type: "image/svg+xml"});
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = finalName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, count * 250);
                    
                    count++;
                }
            }
            toggleExportStudio(false);
        });

        const modal = document.getElementById('editor-modal');
        function initCodeMirror() {
            if (codeMirrorInstance) return;
            codeMirrorInstance = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                mode: "xml", theme: "dracula", lineNumbers: true, lineWrapping: true,
                foldGutter: true, gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"]
            });
        }

        function getCleanSvgString() {
            const clone = state.doc.documentElement.cloneNode(true);
            clone.querySelectorAll('[data-svg-forge-id]').forEach(el => el.removeAttribute('data-svg-forge-id'));
            return new XMLSerializer().serializeToString(clone).replace(/xmlns:xmlns=".*?"/g, '');
        }

        document.getElementById('btn-open-editor').addEventListener('click', () => {
            modal.classList.remove('hidden'); modal.classList.add('flex');
            initCodeMirror();
            codeMirrorInstance.setValue(html_beautify(getCleanSvgString(), { indent_size: 4 }));
            setTimeout(() => codeMirrorInstance.refresh(), 50);
        });

        document.getElementById('btn-close-editor').addEventListener('click', () => {
            modal.classList.add('hidden'); modal.classList.remove('flex');
        });

        document.getElementById('btn-format').addEventListener('click', () => {
            codeMirrorInstance.setValue(html_beautify(codeMirrorInstance.getValue(), { indent_size: 4 }));
        });

        document.getElementById('btn-save-editor').addEventListener('click', () => {
            parseSVG(codeMirrorInstance.getValue());
            pushHistory();
            document.getElementById('btn-close-editor').click();
        });

        document.getElementById('inp-quick-paste').addEventListener('paste', (e) => {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if(text.includes('<svg')) {
                parseSVG(text);
                pushHistory();
                e.target.value = '';
                e.target.placeholder = "SVG loaded successfully!";
                setTimeout(() => e.target.placeholder = "Paste raw <svg> code here...", 2000);
            }
        });

        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            state.transform.scale = Math.min(20, state.transform.scale * 1.2);
            applyTransform(); updateSelectionBox(); if(isExportMode) drawSplitGrid();
        });
        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            state.transform.scale = Math.max(0.1, state.transform.scale * 0.8);
            applyTransform(); updateSelectionBox(); if(isExportMode) drawSplitGrid();
        });

        const sampleSVG = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 800 600" width="800" height="600">
            <defs>
                <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#F43F5E" />
                </marker>
            </defs>
            <g inkscape:groupmode="layer" inkscape:label="Background" id="layer-bg"><rect width="800" height="600" fill="#FFFFFF" /></g>
            <g inkscape:groupmode="layer" inkscape:label="Physics Diagram">
                <circle cx="400" cy="300" r="100" fill="#3B82F6" stroke="#0ea5e9" stroke-width="4" opacity="0.3" />
                <rect x="350" y="250" width="100" height="100" fill="#64748B" />
                <line x1="450" y1="300" x2="600" y2="300" stroke="#F43F5E" stroke-width="4" marker-end="url(#arrowRose)" />
                <text x="620" y="305" font-family="sans-serif" font-size="24" fill="#F43F5E">F</text>
            </g>
        </svg>`;
        
        parseSVG(sampleSVG);
        pushHistory();
        setTool('select');
    </script>
</body>
</html>
